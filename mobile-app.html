/* ------------------------------------------------------------------ */
/* Guided journey flow: one screen per stage, in order, each stage      */
/* fetching its own actions via a Pega CDH call.                        */
/*                                                                      */
/* Design note: we don't have a confirmed API contract for a separate   */
/* container per journey stage on this Pega instance. What IS confirmed */
/* is that the "NextBestAction" container returns real actions from     */
/* this exact journey (e.g. "Market Opportunity Alert" from the sample  */
/* response). So each stage screen calls that confirmed container and   */
/* filters the ranked results down to this stage's known action names   */
/* client-side, rather than guessing at an unconfirmed per-stage API.   */
/* ------------------------------------------------------------------ */

function startJourneyFlow(journeyId) {
  const customer = getCustomer();
  const journey = getJourneyById(journeyId);
  if (!customer || !journey || !journeyMatchesCustomer(journey, customer.id)) return;
  state.activeJourney = journey;
  state.view = "journey";
  state.journeyIndex = 0;
  state.showStageTransition = false;
  state.pendingNextIndex = null;
  writeSharedCurrentStage(customer.id, journey.id, 0);
  render();
  loadJourneyStage(0);
}

function exitJourneyFlow() {
  state.view = "dashboard";
  state.showStageTransition = false;
  state.pendingNextIndex = null;
  render();
}

function goToStage(index) {
  if (!state.activeJourney) return;
  if (index < 0 || index >= state.activeJourney.stages.length) return;
  state.journeyIndex = index;
  writeSharedCurrentStage(state.customerId, state.activeJourney.id, index);
  render();
  loadJourneyStage(index);
}

function handleStageNavClick(targetIndex) {
  if (!state.activeJourney) return;
  // Only the natural "move forward by one" case can have a defined
  // transition screen — jumping backward or skipping ahead goes straight
  // through, same as before.
  if (targetIndex === state.journeyIndex + 1) {
    const fromStage = state.activeJourney.stages[state.journeyIndex].stage;
    const toStage = state.activeJourney.stages[targetIndex].stage;
    const transition = getStageTransition(state.activeJourney.id, fromStage, toStage);
    if (transition) {
      state.showStageTransition = true;
      state.pendingNextIndex = targetIndex;
      render();
      return;
    }
  }
  goToStage(targetIndex);
}

function nextStage() {
  if (!state.activeJourney) return;
  if (state.journeyIndex < state.activeJourney.stages.length - 1) {
    handleStageNavClick(state.journeyIndex + 1);
  } else {
    finishJourney();
  }
}

function completeStageTransition() {
  const nextIndex = state.pendingNextIndex;
  state.showStageTransition = false;
  state.pendingNextIndex = null;
  if (nextIndex != null) goToStage(nextIndex);
}

function prevStage() {
  goToStage(state.journeyIndex - 1);
}

function refreshStage() {
  if (!state.activeJourney) return;
  const stage = state.activeJourney.stages[state.journeyIndex];
  delete state.journeyData[stage.stage];
  loadJourneyStage(state.journeyIndex, true);
}

function finishJourney() {
  pushLog("system", "Guided journey complete — back to dashboard.", state.activeJourney ? state.activeJourney.id : null);
  state.view = "dashboard";
  render();
}

    adoptSharedRobertContainerOffers(customer.id);
    if (!Array.isArray(state.robertContainerOffers)) {
      state.journeyData[stage.stage] = { loading: false, offers: [], meta: null, error: null, source: null };
      pushLog("system", `[${stage.stage}] Nothing to show yet — open the website once as Robert to load his campaign data (this view never fetches it directly).`, state.activeJourney.id);
      render();
      return;
    }
    const matched = filterOffersForStage(state.robertContainerOffers, stage);
    state.journeyData[stage.stage] = { loading: false, offers: matched, meta: state.robertContainerMeta, error: null, source: state.robertContainerMeta?.fallback ? "mock" : "live" };
    if (matched.length > 0) {
      matched.forEach(o => pushLog("impression", `[${stage.stage}] Impression logged Pega CDH RTC — ${o.title}`, state.activeJourney.id));
    } else {
      pushLog("system", `[${stage.stage}] No cached offers matched this stage.`, state.activeJourney.id);
    }
    render();
    return;
  }

  try {
    const result = await simulateCDHRequest(customer, cdhOverrides);
    // Map CDH's raw returned actions to this stage using the journey's source image.
    const matched = filterOffersForStage(result.offers, stage);
    state.journeyData[stage.stage] = { loading: false, offers: matched, meta: result.meta, error: null, source: "live" };
    if (matched.length > 0) {
      const subjectId = isScratchWin ? "CUST36" : customer.id;
      const subjectName = getCustomerNameById(subjectId);
      const subjectNote = subjectName ? ` (Subject: ${subjectName})` : "";
      matched.forEach(o => pushLog("impression", `[${stage.stage}] Impression logged Pega CDH RTC — ${o.title}${subjectNote}`, state.activeJourney.id));
    } else {
      pushLog("system", `[${stage.stage}] CDH responded, but none of the returned actions matched this stage.`, state.activeJourney.id);
    }
  } catch (err) {
    pushLog("system", `[${stage.stage}] CDH call failed (${err.message}) — using local mock strategy`, state.activeJourney.id);
    const scored = filterOffersForStage(scoreOffers(OFFER_CATALOG, customer), stage);
    const fallbackSubjectId = isScratchWin ? "CUST36" : customer.id;
    state.journeyData[stage.stage] = { loading: false, offers: scored, meta: { fallback: true, channel: "Mobile", subjectId: fallbackSubjectId, direction: "Inbound" }, error: err.message, source: "mock" };
    scored.forEach(o => pushLog("impression", `[${stage.stage}] Impression logged Pega CDH RTC — ${o.title} (mock)`, state.activeJourney.id));
  }
  render();
}

/* ---------------- Explainability engine (mirrors js/explainability.js + */
/* the render helpers in js/render-shared.js — kept in sync manually,    */
/* same convention as the rest of this file's inlined logic). ---------- */

// Rule-description text parser — see js/explainability.js's fuller
// comment on the website build. Parses Pega's own pyDescription-style
// HTML (verbatim from the uploaded Rule-Decision-PropositionFilter
// exports), maps each field label onto our customer object, evaluates
// the comparator, and produces the same {label, pass, layer} shape the
// client-derived checks already render.
const PEGA_FIELD_TO_CUSTOMER_KEY = {
  "Is customer active": "isCustomerActive",
  "Count of deposit accounts": "numDepositAccounts",
  "DepositMaturityWindow": "depositMaturityWindow",
  "CustomerMarket": "customerMarket",
  "CLV designation": "clv",
  "Net wealth": "netWealth",
  "MonthlyAvgBalance": "monthlyAvgBalance",
  "BereavementMarker": "bereavementMarker",
  // Confirmed against a real live container call for FD Maturity
  // Reinvestment's SuitabilityDescription: Pega's own rendered label is
  // "Is financially vulnerable" for Customer.IsFinanciallyVulnerable — the
  // same real rule already matched to this catalog's generic
  // riskFlag-based Suitability check, just never added here, so this exact
  // label came back unmapped (silently evaluating as failed — see the
  // unmapped-field fix in evaluateParsedCondition below).
  "Is financially vulnerable": "riskFlag",
};
function parseRuleConditionsHtml(html) {
  if (!html || typeof html !== "string") return [];
  const liRegex = /<li class='condition-row[^']*'>([\s\S]*?)<\/li>/g;
  const conditions = [];
  let match;
  let i = 0;
  while ((match = liRegex.exec(html)) !== null) {
    i++;
    const li = match[1];
    const actualMatch = li.match(/<span class='cp-actual-value'>([\s\S]*?)<\/span>/);
    const comparatorMatch = li.match(/<span class='cp-comparator'>([\s\S]*?)<\/span>/);
    const expectedMatch = li.match(/<span class='cp-expected-value'>([\s\S]*?)<\/span>/);
    if (!actualMatch || !comparatorMatch) continue;
    const fieldLabel = actualMatch[1].replace(/^Customer:\s*/, "").trim();
    const comparator = comparatorMatch[1].trim().toLowerCase();
    let expectedRaw = expectedMatch ? expectedMatch[1].replace(/&quot;/g, '"').trim() : "";
    expectedRaw = expectedRaw.replace(/^Customer:\s*/, "").trim();
    conditions.push({ conditionLabel: `E${i}`, fieldLabel, comparator, expectedRaw });
  }
  return conditions;
}
function evaluateParsedCondition(cond, customer) {
  const key = PEGA_FIELD_TO_CUSTOMER_KEY[cond.fieldLabel];
  const cmp = cond.comparator;
  // An unmapped field label can't be evaluated at all — was silently
  // falling through to the comparator branches below with actual left
  // undefined, which every one of them coerces into a real (wrong) false
  // rather than the documented "can't be evaluated" null (caught live:
  // a real Pega response's own field label for FD Maturity Reinvestment's
  // Suitability rule, "Is financially vulnerable", read as failed for
  // Aria even though she isn't, before that label was added above).
  if (!key) {
    return { conditionLabel: cond.conditionLabel, label: `${cond.fieldLabel} ${cmp} ${cond.expectedRaw}`.trim(), pass: null };
  }
  const actual = customer[key];
  let pass = null;
  let label;
  if (cmp === "is true") {
    pass = actual === true;
    label = cond.fieldLabel;
  } else if (cmp === "is false") {
    pass = actual === false;
    label = `${cond.fieldLabel} is false`;
  } else if (cmp === "is greater than" || cmp === "is less than") {
    const expectedNum = Number(cond.expectedRaw.replace(/[^0-9.-]/g, ""));
    pass = cmp === "is greater than" ? Number(actual) > expectedNum : Number(actual) < expectedNum;
    label = `${cond.fieldLabel} ${cmp} ${expectedNum.toLocaleString()}`;
  } else if (cmp === "is equal to") {
    const expected = cond.expectedRaw.replace(/^"|"$/g, "");
    pass = String(actual) === expected;
    label = `${cond.fieldLabel} is equal to ${expected}`;
  } else if (cmp === "is in list") {
    const values = [...cond.expectedRaw.matchAll(/"([^"]+)"/g)].map(m => m[1]);
    const list = values.length ? values : cond.expectedRaw.split(",").map(s => s.trim());
    pass = list.includes(String(actual));
    label = `${cond.fieldLabel} is in list ${list.map(v => `"${v}"`).join(",")}`;
  } else {
    label = `${cond.fieldLabel} ${cmp} ${cond.expectedRaw}`.trim();
  }
  return { conditionLabel: cond.conditionLabel, label, pass: pass === null ? null : !!pass };
}
function checksFromRuleDescriptionHtml(html, customer, layer) {
  return parseRuleConditionsHtml(html).map(cond => {
    const evaluated = evaluateParsedCondition(cond, customer);
    return { label: evaluated.label, pass: evaluated.pass, layer, conditionLabel: evaluated.conditionLabel };
  });
}

// Contact Policy parser — a live container call (2026-08) confirmed
// ContactPolicyDescription's format changed to a flat list of
// contact-policy rule instances (<pxPage><pxResults REPEATINGTYPE=
// "PageList"><rowdata REPEATINGINDEX="N">...</rowdata>...), one row per
// suppression counter (CP-IMPR-G-7D / CP-ACPT-G-7D / CP-REJ-G-7D). Per
// explicit instruction, only CP-REJ-G-7D is parsed and surfaced for now.
const CONTACT_POLICY_ELEMENT_TO_PARSE = "CP-REJ-G-7D";
function parseContactPolicyDescription(xml) {
  if (!xml || typeof xml !== "string") return null;
  const rowRegex = /<rowdata REPEATINGINDEX="\d+">([\s\S]*?)<\/rowdata>/g;
  let match;
  while ((match = rowRegex.exec(xml)) !== null) {
    const row = match[1];
    const labelMatch = row.match(/<pyLabel>([\s\S]*?)<\/pyLabel>/);
    if (!labelMatch || labelMatch[1].trim() !== CONTACT_POLICY_ELEMENT_TO_PARSE) continue;
    const field = tag => {
      const m = row.match(new RegExp(`<${tag}>([\\s\\S]*?)</${tag}>`));
      return m ? m[1].trim() : null;
    };
    return {
      label: field("pyLabel"),
      name: field("pyName"),
      definitionLabel: field("DefinitionLabel"),
      outcome: field("pyOutcome"),
      maxAllowedOutcomes: field("MaxAllowedOutcomes"),
      suppressionDuration: field("SuppressionDuration"),
      suppressionPeriod: field("SuppressionPeriod"),
      contactPolicyLevel: field("ContactPolicyLevel"),
      ihSummaryName: field("IHSummaryName"),
      ihSummaryDuration: field("IHSummaryDuration"),
      targetAction: field("TargetAction"),
      channel: field("pyChannel"),
    };
  }
  return null;
}

function passesRuleDescriptionHtml(html, customer) {
  return checksFromRuleDescriptionHtml(html, customer, "eligibility").every(c => c.pass !== false);
}

function extractArrowBody(fn) {
  const src = fn.toString();
  const arrowIdx = src.indexOf("=>");
  if (arrowIdx === -1) return src;
  let body = src.slice(arrowIdx + 2).trim();
  if (body.startsWith("{")) return body;
  if (body.endsWith(";")) body = body.slice(0, -1);
  return body;
}

function splitTopLevelAnd(expr) {
  const parts = [];
  let depth = 0, current = "";
  for (let i = 0; i < expr.length; i++) {
    const ch = expr[i];
    if (ch === "(") depth++;
    if (ch === ")") depth--;
    if (ch === "&" && expr[i + 1] === "&" && depth === 0) {
      parts.push(current.trim());
      current = "";
      i++;
      continue;
    }
    current += ch;
  }
  if (current.trim()) parts.push(current.trim());
  return parts;
}

function describeClause(clause) {
  if (/isLoanCardJourneyCustomer\(c\.id\)/.test(clause)) return "Enrolled in the Personal Loan & Card Cross-Sell journey";
  if (/c\.id\s*===\s*MAYA_CUSTOMER_ID/.test(clause)) return "Enrolled in the Digital Activation & Onboarding journey";
  if (/c\.id\s*===\s*PRIYA_CUSTOMER_ID/.test(clause)) return "Enrolled in the Personal Loan & Card Cross-Sell journey";
  if (/c\.id\s*===\s*"CUST44"/.test(clause)) return "Enrolled in the New Customer Acquisition journey";
  if (/c\.id\s*===\s*"CUST101"/.test(clause)) return "Enrolled in the Wealth Management & Advisory journey";
  let m;
  if (/^!c\.riskFlag$/.test(clause)) return "No active risk flag on the account";
  if (/^c\.riskFlag\s*===\s*true$/.test(clause)) return "Risk flag is active on the account";
  if ((m = clause.match(/^c\.creditScore\s*(>=|<=|>|<)\s*(\d+)$/))) return `Credit score ${m[1]} ${m[2]}`;
  if ((m = clause.match(/^c\.tenureYears\s*(>=|<=|>|<)\s*([\d.]+)$/))) return `Account tenure ${m[1]} ${m[2]} year${m[2] == 1 ? "" : "s"}`;
  if ((m = clause.match(/^!c\.holdings\.includes\("(\w+)"\)$/))) return `Does not currently hold a ${m[1]} product`;
  if ((m = clause.match(/^c\.holdings\.includes\("(\w+)"\)$/))) return `Already holds a ${m[1]} product`;
  if ((m = clause.match(/^c\.digitalEngagement\s*===\s*"(\w+)"$/))) return `Digital engagement level is "${m[1]}"`;
  if ((m = clause.match(/^c\.segment\s*===\s*"(\w+)"$/))) return `Customer segment is ${m[1]}`;
  // Transcribed from a real Pega Rule-Decision-PropositionFilter export
  // (see js/data.js's comment on fd-maturity-reinvestment in the website
  // build) — condition labels mirror the rule's own pyLabel/
  // pyComparatorFieldLabel text rather than being freely reworded.
  if (/^c\.isCustomerActive\s*===\s*true$/.test(clause)) return "Is customer active";
  if ((m = clause.match(/^c\.numDepositAccounts\s*>\s*(\d+)$/))) return `Count of deposit accounts is greater than ${m[1]}`;
  if ((m = clause.match(/^\["([^"]+)","([^"]+)"\]\.includes\(c\.depositMaturityWindow\)$/))) return `DepositMaturityWindow is in list "${m[1]}","${m[2]}"`;
  if ((m = clause.match(/^c\.netWealth\s*>\s*(\d+)$/))) return `Net wealth is greater than ${Number(m[1]).toLocaleString()}`;
  if ((m = clause.match(/^c\.monthlyAvgBalance\s*>\s*(\d+)$/))) return `MonthlyAvgBalance is greater than ${Number(m[1]).toLocaleString()}`;
  if ((m = clause.match(/^c\.digitalEngagement\s*===\s*"(\w+)"\s*\|\|\s*c\.digitalEngagement\s*===\s*"(\w+)"$/))) {
    return `Digital engagement level is "${m[1]}" or "${m[2]}"`;
  }
  return clause.replace(/^c\./, "").replace(/c\./g, "");
}

function evaluateClause(clause, customer) {
  try {
    return !!new Function("c", "MAYA_CUSTOMER_ID", "PRIYA_CUSTOMER_ID", "isLoanCardJourneyCustomer",
      `return (${clause});`
    )(customer, MAYA_CUSTOMER_ID, PRIYA_CUSTOMER_ID, isLoanCardJourneyCustomer);
  } catch (err) {
    return null;
  }
}

function buildEligibilityChecks(offer, customer) {
  if (!offer.eligibility) {
    // See js/explainability.js's fuller comment on the website build —
    // a live-mapped offer never has a client-side eligibility() function,
    // so this used to silently return an empty array and make the whole
    // Eligibility section vanish from the receipt.
    return [{ label: "No eligibility rule trace available for this offer", pass: null, layer: "eligibility" }];
  }
  const body = extractArrowBody(offer.eligibility);
  const clauses = splitTopLevelAnd(body);
  return clauses.map(clause => {
    const pass = evaluateClause(clause, customer);
    return { label: describeClause(clause), pass, layer: "eligibility" };
  });
}

// Market-scope condition (real Pega rule: NBA_Acquire_WealthandInvestment_
// A_Customer, "Customer.CustomerMarket is equal to All") is offer-specific
// real rule data, represented via the applicabilityDescription API placeholder
// (explainOffer, below) instead of a generic check here — see js/
// explainability.js's fuller comment on the website build.
function buildApplicabilityChecks(offer, customer, responses, session) {
  const checks = [];
  const alreadyResponded = !!(responses && responses[offer.id]);
  checks.push({ label: "Not already responded to (accepted/dismissed)", pass: !alreadyResponded, layer: "applicability" });
  const stageName = typeof findJourneyStageForOffer === "function" ? findJourneyStageForOffer(offer) : null;
  if (stageName && offer.group && session) {
    const journey = JOURNEYS.find(j => j.title === offer.group);
    if (journey && session.currentJourneyId === journey.id) {
      const stageIndex = journey.stages.findIndex(s => s.stage === stageName);
      const reached = stageIndex !== -1 && (session.currentStageIndex || 0) >= stageIndex;
      checks.push({ label: `Customer has reached the "${stageName}" journey stage`, pass: reached, layer: "applicability" });
    }
  }
  if (session && typeof session.outage === "boolean") {
    checks.push({ label: "Live decisioning channel active (not simulated outage)", pass: !session.outage, layer: "applicability" });
  }
  return checks;
}

// Suitability's riskFlag check below already is the real Pega Suitability
// rule for FD Maturity Reinvestment (NBA_Acquire_WealthandInvestment_S_
// Customer, condition "Customer.IsFinanciallyVulnerable is false") —
// riskFlag is this catalog's existing stand-in for that field.
function buildSuitabilityChecks(offer, customer) {
  const checks = [];
  if (customer.riskFlag !== undefined) {
    checks.push({ label: "Customer is not flagged as financially vulnerable", pass: !customer.riskFlag, layer: "suitability" });
  }
  if (customer.debtToIncomeRatio !== undefined) {
    checks.push({ label: "Debt-to-income ratio within acceptable range (< 45%)", pass: customer.debtToIncomeRatio < 0.45, layer: "suitability" });
  }
  const isLendingRelated = offer.category === "Lending" || /loan|credit/i.test(offer.group || "") || /loan|credit/i.test(offer.category || "");
  if (isLendingRelated && customer.creditScore !== undefined) {
    checks.push({ label: "Credit score meets responsible-lending minimum (620)", pass: customer.creditScore >= 620, layer: "suitability" });
  }
  return checks;
}

function lowerFirst(str) {
  return str.charAt(0).toLowerCase() + str.slice(1);
}

function buildReasonCode(offer, eligChecks, appChecks, suitChecks) {
  const passedElig = eligChecks.filter(c => c.pass).map(c => lowerFirst(c.label));
  const passedApp = appChecks.filter(c => c.pass).map(c => lowerFirst(c.label));
  const failedAny = [...eligChecks, ...appChecks, ...suitChecks].some(c => c.pass === false);
  if (failedAny) {
    const failedCheck = [...eligChecks, ...appChecks, ...suitChecks].find(c => c.pass === false);
    return `This offer would normally be suppressed — it failed the check "${failedCheck.label}." Shown here for demo purposes despite the failed condition.`;
  }
  const parts = [];
  if (passedElig.length) parts.push(passedElig.join(" and "));
  if (passedApp.length) parts.push(passedApp[0]);
  if (!parts.length) return `Shown because "${offer.title}" is currently eligible and available for this customer.`;
  return `Shown because ${parts.join(", and ")}.`;
}

// Small helper: coerces to a finite number, falling back to a sensible
// default when the value is missing or not actually numeric (real Pega
// field values aren't guaranteed to always be parseable, especially for
// fields being repurposed to carry arbitration inputs the way this demo's
// instance does).
function numOrDefault(value, fallback) {
  const n = Number(value);
  return Number.isFinite(n) ? n : fallback;
}

// Arbitration: Priority Score × Propensity × Context Weight × Value × Lever
// — see js/explainability.js for the full explanation of why this handles
// two different offer shapes (OFFER_CATALOG mock entries vs. mapPegaOffer-
// mapped live offers) the way it does. Kept identical here since this
// file inlines its own copy rather than loading the shared script.
function computeArbitrationScore(offer, customer) {
  const isLiveOffer = typeof offer.propensity !== "function";
  const propensity = isLiveOffer
    ? numOrDefault(offer.propensityValue, 0.5)
    : (offer.propensity(customer) ?? 0.5);
  const contextWeight = isLiveOffer
    ? numOrDefault(offer.contextWeight, 0.5)
    : (offer.urgency ?? 5) / 10;
  const value = isLiveOffer
    ? numOrDefault(offer.value, 0.5)
    : (offer.businessValue ?? 5) / 10;
  const lever = numOrDefault(offer.lever, 1);
  const score = propensity * contextWeight * value * lever;
  const priorityScore = numOrDefault(offer.priority, +score.toFixed(4));
  return { propensity, contextWeight, value, lever, score, priorityScore };
}

function rankOfferAmongSiblings(offer, siblingOffers, customer) {
  const pool = (siblingOffers && siblingOffers.length ? siblingOffers : [offer]).filter(o => !o.fallback);
  const scored = pool.map(o => ({ id: o.id, title: o.title, ...computeArbitrationScore(o, customer) }));
  scored.sort((a, b) => b.score - a.score);
  const rank = scored.findIndex(s => s.id === offer.id) + 1;
  return { rank: rank || 1, total: scored.length, scored, mine: computeArbitrationScore(offer, customer) };
}

// Turns an API-returned rule-trace entry into the {label, pass, layer}
// shape the client-derived checks already produce — see js/explainability.js
// for the fuller comment on the website build.
function checkFromApiRule(rule, layer) {
  return { label: rule.label, pass: !!rule.pass, layer, conditionLabel: rule.conditionLabel };
}
function rulesToChecks(rulesField, customer, layer) {
  if (typeof rulesField === "string") return checksFromRuleDescriptionHtml(rulesField, customer, layer);
  if (Array.isArray(rulesField)) return rulesField.map(r => checkFromApiRule(r, layer));
  return null;
}

function explainOffer(offer, customer, responses, session, siblingOffers) {
  // Placeholder for a real container API response carrying its own rule
  // trace alongside the offer (offer.eligibilityDescription/.applicabilityDescription/
  // .suitabilityDescription — see mapPegaOffer, js/cdh.js on the website build,
  // and FD Maturity Reinvestment's/Tax-Optimisation Reminder's catalog
  // entries above). The realistic shape is a single opaque STRING per
  // layer — Pega's own pyDescription-style HTML — parsed and evaluated by
  // rulesToChecks() above, not a pre-evaluated array. Eligibility fully
  // replaces when present (already 100% offer-specific); Applicability/
  // Suitability merge the parsed rules in alongside the generic checks
  // rather than replacing them.
  const eligibility = rulesToChecks(offer.eligibilityDescription, customer, "eligibility") || buildEligibilityChecks(offer, customer);
  const applicability = [
    ...(rulesToChecks(offer.applicabilityDescription, customer, "applicability") || []),
    ...buildApplicabilityChecks(offer, customer, responses, session),
  ];
  const suitability = [
    ...(rulesToChecks(offer.suitabilityDescription, customer, "suitability") || []),
    ...buildSuitabilityChecks(offer, customer),
  ];
  const reason = buildReasonCode(offer, eligibility, applicability, suitability);
  const arbitration = rankOfferAmongSiblings(offer, siblingOffers, customer);
  const contactPolicy = parseContactPolicyDescription(offer.contactPolicyDescription);
  return { offer, reason, eligibility, applicability, suitability, arbitration, contactPolicy };
}

function renderOfferCard(offer, showJourneyStage = false, compact = false, readOnly = false, diegoSmall = false) {
  const isFallback = !!offer.fallback;
  const expanded = state.expandedId === offer.id;
  const responseStatus = state.responses[offer.id];
  const journeyStage = showJourneyStage && !isFallback ? findJourneyStageForOffer(offer) : null;
  // Matched by title, not id — live CDH assigns ids from Pega's own Name
  // field, which won't match any hardcoded id here regardless of source.
  const showsApplyNow = !isFallback && normalizeActionTitle(offer.title) === normalizeActionTitle("Personal Loan Offer");

  // need scaling here too or they'd overflow their now-smaller badge/button.
  const iconPx = diegoSmall ? 11 : 14;
  const badgeIconPx = diegoSmall ? 14 : 18;

  let actionsHtml;
  if (readOnly) {
    // Diego's Progress Monitor cards (dashboard.html has the same

    // queue, so there's nothing to accept or dismiss here.
    actionsHtml = "";
  } else if (isFallback) {
    actionsHtml = `
      <div class="bnk-fallback-note">Static fallback — real-time decisioning unavailable</div>
      <div class="bnk-card-actions"><button class="bnk-btn-ghost" style="width:100%;">${offer.cta}</button></div>`;
  } else if (responseStatus) {
    const cls = responseStatus === "accepted" ? "bnk-response-accepted" : "bnk-response-dismissed";
    const ic = responseStatus === "accepted" ? icon("check", iconPx) : icon("x", iconPx);
    const label = responseStatus === "accepted" ? "Accepted" : "Dismissed";
    actionsHtml = `<div class="bnk-response-badge ${cls}">${ic}${label}</div>`;
  } else if (showsApplyNow) {
    actionsHtml = `
      <div class="bnk-card-actions">
        <button class="bnk-btn-primary" onclick="handleLoanCalculatorApply('${offer.id}')">${icon("send", iconPx)} Apply Now</button>
        <button class="bnk-btn-ghost" onclick="respond('${offer.id}','dismissed')">Not now</button>

  } else if (showsApplyInvestment) {
    actionsHtml = `

        <button class="bnk-btn-ghost" onclick="respond('${offer.id}','dismissed')">Not now</button>

        <button class="bnk-btn-ghost" onclick="respond('${offer.id}','dismissed')">Not now</button>
      </div>`;
  }

  let receiptHtml = "";
  if (!isFallback && !compact) {
    receiptHtml = `
      <button class="bnk-receipt-toggle" onclick="toggleExpand('${offer.id}')">
        <span>Decision receipt</span>${expanded ? icon("chevronUp", iconPx) : icon("chevronDown", iconPx)}
      </button>`;
    if (expanded) {
      const rows = [];
      if (offer.category) rows.push(renderReceiptRow("Issue", offer.category));
      if (offer.treatmentId) rows.push(renderReceiptRow("Treatment", offer.treatmentId));
      if (offer.model) rows.push(renderReceiptRow("Model", offer.model));
      if (offer.group) rows.push(renderReceiptRow("Group", offer.group));
      if (offer.businessValue !== undefined) rows.push(renderReceiptRow("Business value", `${offer.businessValue} / 10`));
      if (offer.urgency !== undefined) rows.push(renderReceiptRow("Urgency lever", `${offer.urgency} / 10`));
      rows.push(`<div class="bnk-receipt-divider"></div>`);
      if (offer.interactionID) rows.push(renderReceiptRow("Interaction ID", offer.interactionID));
      const receiptCustomer = getCustomer();
      if (receiptCustomer) {
        rows.push(`<div class="bnk-receipt-divider"></div>`);
        rows.push(renderReceiptRow("No. of loan accounts", receiptCustomer.numLoanAccounts));
        rows.push(renderReceiptRow("Credit score", receiptCustomer.creditScore));
        rows.push(renderReceiptRow("Age", receiptCustomer.age));
        rows.push(renderReceiptRow("Customer segment", receiptCustomer.segment));
        rows.push(renderReceiptRow("Financially vulnerable", receiptCustomer.riskFlag ? "Yes" : "No"));
        rows.push(renderReceiptRow("Debt-to-income ratio", `${Math.round(receiptCustomer.debtToIncomeRatio * 100)}%`));
        // Shown only for the loan journey's Loan Top-Up / Refinance offer
        // specifically — matched by title, not id, since live CDH assigns
        // ids from Pega's own Name field, not our catalog id.
        if (isLoanCardJourneyCustomer(receiptCustomer.id) && normalizeActionTitle(offer.title) === normalizeActionTitle("Loan Top-Up / Refinance")) {
          rows.push(renderReceiptRow("Active loan balance", `$${receiptCustomer.activeLoanBalance.toLocaleString()}`));
          rows.push(renderReceiptRow("Relationship length", receiptCustomer.relationshipLength));
          rows.push(renderReceiptRow("Days past due", `${receiptCustomer.daysPastDue} days`));
        }
      }
      let explainHtml = "";
      if (receiptCustomer && typeof explainOffer === "function") {
        try {
          // No loadSession() on this file — mobile's own state doesn't use
          // the website's session object at all. buildApplicabilityChecks
          // (js/explainability.js) only ever reads session.outage/
          // .currentJourneyId/.currentStageIndex, so a plain object
          // carrying those three off mobile's own `state` is a complete,
          // correct stand-in — this was silently calling an undefined
          // function before (caught by this same try/catch), which meant
          // the ENTIRE Eligibility/Applicability/Suitability/Arbitration/
          // Contact Policy section never rendered on mobile at all.
          const sessionLike = { outage: state.outage, currentJourneyId: state.activeJourney?.id ?? null, currentStageIndex: state.journeyIndex };
          explainHtml = renderExplainabilityHtml(explainOffer(offer, receiptCustomer, state.responses, sessionLike, state.offers));
        } catch (err) {
          explainHtml = "";
        }
      }
      receiptHtml += `<div class="bnk-receipt">${rows.join("")}${explainHtml}</div>`;
    }
  }

  return `
    <div class="bnk-card ${compact ? "bnk-card-compact" : ""} ${diegoSmall ? "bnk-card-diego-small" : ""}" id="offer-${offer.id}">
      ${!isFallback && !responseStatus && !compact ? `<div class="bnk-card-ribbon">New</div>` : ""}

      ${!compact ? `<div class="bnk-ticket-divider"></div>` : ""}
      ${actionsHtml}
      ${receiptHtml}
    </div>`;
}

    const stepsHtml = (transition?.steps || []).map((step, i, arr) => `

        <div class="bnk-transition-body">
          <div class="bnk-transition-label">${step.label}</div>
          <div class="bnk-transition-detail">${step.detail}</div>
        </div>
      </div>`).join("");

    return `
      <div>
        <div class="bnk-header">
          <div class="bnk-brand" style="margin-bottom:0;">${icon("landmark", 20)}<span class="bnk-brand-word">Instellars</span></div>
          <div class="bnk-header-right">
            <span style="font-size:0.85rem;">Guided journey \u00b7 ${customer.name}</span>
            <button class="bnk-signout-btn" onclick="exitJourneyFlow()">${icon("x", 14)}<span> Exit to dashboard</span></button>
          </div>
        </div>
        <div class="bnk-body">
          <div class="bnk-display" style="font-size:1.15rem;margin-bottom:0.25rem;">${transition?.title || `${fromStage} \u2192 ${toStage}`}</div>
          <div class="bnk-section-sub" style="margin-bottom:1.2rem;">What actually happens, behind the scenes, between these two stages.</div>
          <div class="bnk-application-panel">
            ${stepsHtml}
          </div>
          <div class="bnk-journey-nav">
            <span></span>
            <button class="bnk-btn-primary" style="flex:none;padding:0.6rem 1.4rem;" onclick="completeStageTransition()">Continue to ${toStage} ${icon("chevronRight", 14)}</button>
          </div>
        </div>
      </div>`;
  }

  const data = state.journeyData[stage.stage] || { loading: true, offers: [] };

  const stepperHtml = journeyStages.map((s, i) => {
    const status = i === idx ? "current" : i < idx ? "done" : "upcoming";
    const dotContent = i < idx ? icon("check", 12) : String(i + 1);
    const connector = i < journeyStages.length - 1 ? `<div class="bnk-stepper-line ${i < idx ? "done" : ""}"></div>` : "";
    return `
      <button class="bnk-stepper-item" onclick="handleStageNavClick(${i})">
        <span class="bnk-stepper-dot bnk-stepper-${status}">${dotContent}</span>
        <span class="bnk-stepper-label">${s.stage}</span>
      </button>${connector}`;
  }).join("");

  let bodyHtml;
  if (stage.actions.length === 0) {
    bodyHtml = `<div class="bnk-journey-empty">No actions have been defined for the ${stage.stage} stage yet.</div>`;
  } else if (data.loading) {
    bodyHtml = `<div class="bnk-offers-grid">${stage.actions.map(() => `
      <div class="bnk-skeleton">
        <div class="bnk-skeleton-line" style="width:40%;height:12px;margin-bottom:14px;"></div>
        <div class="bnk-skeleton-line" style="width:80%;height:18px;margin-bottom:10px;"></div>
        <div class="bnk-skeleton-line" style="width:100%;height:10px;margin-bottom:6px;"></div>
        <div class="bnk-skeleton-line" style="width:90%;height:10px;"></div>
      </div>`).join("")}</div>`;
  } else if (data.offers.length === 0) {
    // Robert/Aria/Maya: an empty result here is ambiguous — either genuinely
    // nothing eligible, or the website hasn't been visited this session yet
    // (this view never fetches its own copy — see
    // adoptSharedRobertContainerOffers/adoptSharedAriaContainerOffers/
    // adoptSharedMayaContainerOffers).
    bodyHtml = (customer.id === PRIYA_CUSTOMER_ID && !Array.isArray(state.robertContainerOffers))
      ? `<div class="bnk-journey-empty">Nothing to show yet — open the website once as Robert to load his offers (this view never fetches it directly).</div>`
      : (customer.id === "CUST101" && !Array.isArray(state.ariaContainerOffers))
      ? `<div class="bnk-journey-empty">Nothing to show yet — open the website once as Aria to load her offers (this view never fetches it directly).</div>`
      : (customer.id === MAYA_CUSTOMER_ID && state.activeJourney.id === "digital-activation-onboarding" && !Array.isArray(state.mayaContainerOffers))
      ? `<div class="bnk-journey-empty">Nothing to show yet — open the website once as Maya to load her offers (this view never fetches it directly).</div>`
      : (customer.id === SME_CUSTOMER_ID && !Array.isArray(state.farahContainerOffers))
      ? `<div class="bnk-journey-empty">Nothing to show yet — open the website once as Farah to load her offers (this view never fetches it directly).</div>`
      : (customer.id === SME_LOYALTY_CUSTOMER_ID && !Array.isArray(state.carlosContainerOffers))
      ? `<div class="bnk-journey-empty">Nothing to show yet — open the website once as Carlos to load his offers (this view never fetches it directly).</div>`
      : (customer.id === SME_LENDING_CUSTOMER_ID && !Array.isArray(state.elenaContainerOffers))
      ? `<div class="bnk-journey-empty">Nothing to show yet — open the website once as Elena to load her offers (this view never fetches it directly).</div>`
      : (customer.id === SME_DIGITAL_BANKING_CUSTOMER_ID && !Array.isArray(state.danielaContainerOffers))
      ? `<div class="bnk-journey-empty">Nothing to show yet — open the website once as Daniela to load her offers (this view never fetches it directly).</div>`
      : (customer.id === "CUST44" && !Array.isArray(state.samContainerOffers))
      ? `<div class="bnk-journey-empty">Nothing to show yet — open the website once as Sam to load his offers (this view never fetches it directly).</div>`
      : (customer.id === CARD_INTENT_CUSTOMER_ID && !Array.isArray(state.leoContainerOffers))
      ? `<div class="bnk-journey-empty">Nothing to show yet — open the website once as Leo to load his offers (this view never fetches it directly).</div>`
      : (customer.id === LOAN_INTENT_CUSTOMER_ID && !Array.isArray(state.naomiContainerOffers))
      ? `<div class="bnk-journey-empty">Nothing to show yet — open the website once as Naomi to load her offers (this view never fetches it directly).</div>`
      : (customer.id === DIGITAL_DEEPENING_CUSTOMER_ID && !Array.isArray(state.mariaContainerOffers))
      ? `<div class="bnk-journey-empty">Nothing to show yet — open the website once as Maria to load her offers (this view never fetches it directly).</div>`
      : (customer.id === OFW_FAMILY_CUSTOMER_ID && !Array.isArray(state.angelicaContainerOffers))
      ? `<div class="bnk-journey-empty">Nothing to show yet — open the website once as Angelica to load her offers (this view never fetches it directly).</div>`
      : `<div class="bnk-journey-empty">No eligible actions for ${customer.name} at the ${stage.stage} stage right now — try a different customer profile from the login screen.</div>`;
  } else {
    const journeyOffersToShow = state.activeJourney.id === "loan-card-crosssell"
      ? hideAcceptedPreApprovedOffer(data.offers)
      : data.offers;
    bodyHtml = journeyOffersToShow.length === 0
      ? `<div class="bnk-journey-empty">No eligible actions for ${customer.name} at the ${stage.stage} stage right now — try a different customer profile from the login screen.</div>`
      : `<div class="bnk-offers-grid bnk-offers-grid-journey">${journeyOffersToShow.map(o => renderOfferCard(o, false)).join("")}</div>`;

function renderDashboard() {
  const customer = getCustomer();
  const accounts = getAccountsForCustomer(customer);
  const heroAccount = accounts[0];
  const secondaryAccounts = accounts.slice(1);
  const firstName = customer.name.split(" ")[0];
  const hour = new Date().getHours();
  const timeOfDay = hour < 12 ? "morning" : hour < 18 ? "afternoon" : "evening";
  // An empty state.offers is genuinely ambiguous for Diego (unlike every
  // other customer, where it always means "nothing to show") — it also
  // means "no container data adopted yet", since this app never fetches

  let offersHtml;
  if (state.loading) {

      : ariaNoDataYet

      : mayaNoDataYet
      ? mayaNoDataHtml
      : farahNoDataYet
      ? farahNoDataHtml
      : carlosNoDataYet
      ? carlosNoDataHtml
      : elenaNoDataYet
      ? elenaNoDataHtml
      : danielaNoDataYet
      ? danielaNoDataHtml
      : samNoDataYet
      ? samNoDataHtml
      : leoNoDataYet
      ? leoNoDataHtml
      : naomiNoDataYet

      : mariaNoDataYet
      ? mariaNoDataHtml

  const secondaryAccountsHtml = secondaryAccounts.map(a => `

  const pe = state.supabaseEvents;
  const renderEventRow = e => `

// Diego (C1004) only — replaces the standard 5-tab bar above entirely, per
// explicit request: no separate Journeys/Messages/More here, just his four
// panels. Each tab is an exclusive filtered view (state.diegoTab), same
// pattern as mobileOffersOnly/mobileMessagesOnly for other customers —
// tapping one shows ONLY that section, not all four at once. His combined
// "everything together" dashboard is still what renders immediately after
// login (state.diegoTab === null), before any tab has been tapped.
const DIEGO_BOTTOM_TABS = [
  { id: "diego-missions", label: "Missions", icon: "briefcase" },
  { id: "diego-milestones", label: "Milestones", icon: "landmark" },
  { id: "diego-progress", label: "Progress", icon: "trendingUp" },
  { id: "diego-offers", label: "Offers", icon: "creditCard" },
];

function renderBottomTabBar() {
  const isDiego = state.customerId === "C1004";
  const tabs = isDiego ? DIEGO_BOTTOM_TABS : BOTTOM_TABS;
  // Every other customer's tab bar defaults to "Home" highlighted (their
  // dashboard IS the home view on login) and otherwise only changes via a
  // manual tap (handleTabNav toggles the DOM class directly, no state to
  // read back). Diego's tabs, by contrast, can also flip programmatically —
  // e.g. respond() auto-opening Missions/Milestones after certain actions —
  // so his highlighting is derived from state.diegoTab on every regenerate
  // instead, kept in sync by render()'s lastTabbarDiegoTab check below.
  return tabs.map((t, i) => {
    const isCurrent = isDiego ? state.diegoTab === t.id.slice("diego-".length) : i === 0;
    return `
    <button class="bnk-tab-item ${isCurrent ? "current" : ""}" data-tab-id="${t.id}" onclick="handleTabNav('${t.id}', this)">
      ${icon(t.icon, 17)}
      <span>${t.label}</span>
    </button>`;
  }).join("");
}

// Used by the plain-text message link for specific offers (currently just

function handleRefreshOffersOnlyStage() {
  if (!state.activeJourney) return;
  const stage = state.activeJourney.stages[state.journeyIndex];
  delete state.journeyData[stage.stage];
  loadJourneyStage(state.journeyIndex, true);
}

function handleContinueJourneyFromOffers() {
  if (!state.activeJourney) return;
  state.mobileOffersOnly = false;
  state.view = "journey";
  render();
  loadJourneyStage(state.journeyIndex);
}

function handleTabNav(tabId, btnEl) {
  document.querySelectorAll(".bnk-tab-item").forEach(b => b.classList.remove("current"));
  if (btnEl) btnEl.classList.add("current");

  if (tabId.startsWith("diego-")) {
    state.diegoTab = tabId.slice("diego-".length);
    render();
    const scrollContainer = document.querySelector(".bnk-phone-scroll");
    if (scrollContainer) scrollContainer.scrollTop = 0;
    return;
  }

  if (tabId === "offers") {
    state.mobileOffersOnly = true;
    state.mobileMessagesOnly = false;
    render();
    const scrollContainer = document.querySelector(".bnk-phone-scroll");
    if (scrollContainer) scrollContainer.scrollTop = 0;
    return;
  }

  if (tabId === "messages") {
    state.mobileMessagesOnly = true;
    state.mobileOffersOnly = false;
    render();
    const scrollContainer = document.querySelector(".bnk-phone-scroll");
    if (scrollContainer) scrollContainer.scrollTop = 0;
    return;
  }

  // Any other tab always returns to the full dashboard first — the scroll
  // targets below (journey map, activity ledger, quick links) don't exist in
  // the DOM while the offers-only or messages-only view is showing.
  const wasFiltered = state.mobileOffersOnly || state.mobileMessagesOnly;
  state.mobileOffersOnly = false;
  state.mobileMessagesOnly = false;
  if (wasFiltered) render();

  const tabs = state.customerId === "C1004" ? DIEGO_BOTTOM_TABS : BOTTOM_TABS;
  const tab = tabs.find(t => t.id === tabId);
  const scrollContainer = document.querySelector(".bnk-phone-scroll");
  if (!scrollContainer) return;
  if (!tab || !tab.scrollTo) {
    scrollContainer.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }
  const target = document.querySelector(tab.scrollTo);
  if (target) {
    target.scrollIntoView({ behavior: "smooth", block: "start" });
  } else {
    scrollContainer.scrollTo({ top: 0, behavior: "smooth" });
  }
}

let lastRenderedView = null;
let lastTabbarCustomerId = undefined;
let lastTabbarDiegoTab = undefined;

function render() {
  const app = document.getElementById("app");
  document.body.classList.toggle("bnk-journey-active", state.view === "journey" && !!state.customerId);
  const scrollContainer = document.querySelector(".bnk-phone-scroll");
  const currentViewKey = state.customerId ? state.view : "login";
  if (!state.customerId) {
    app.innerHTML = renderLogin();
  } else if (state.view === "journey") {
    app.innerHTML = renderJourneyFlow();
  } else if (state.view === "newApplication") {
    app.innerHTML = renderNewApplicationFlow();
  } else if (state.view === "investmentApplication") {
    app.innerHTML = renderInvestmentApplicationFlow();
  } else if (state.view === "thanksScreen") {
    app.innerHTML = renderThanksScreen();
  } else if (state.view === "emiCalculator") {
    app.innerHTML = renderEmiCalculatorScreen();
  } else {
    app.innerHTML = renderDashboard();
  }
  const tabbar = document.getElementById("bottom-tabbar");
  const showTabbar = !!state.customerId && state.view === "dashboard";
  if (tabbar) {
    tabbar.classList.toggle("active", showTabbar);
    // Regenerates whenever the logged-in customer changes (Diego's tab set
    // is different from everyone else's) or, for Diego specifically,
    // whenever state.diegoTab itself changes — needed because that can now
    // flip programmatically (respond() auto-opening Missions/Milestones),
    // not just via a manual tap that already updates its own DOM class.
    if (showTabbar && (!tabbar.innerHTML || lastTabbarCustomerId !== state.customerId || lastTabbarDiegoTab !== state.diegoTab)) {
      tabbar.innerHTML = renderBottomTabBar();
      lastTabbarCustomerId = state.customerId;
      lastTabbarDiegoTab = state.diegoTab;
    }
  }
  if (scrollContainer && currentViewKey !== lastRenderedView) {
    scrollContainer.scrollTop = 0;
  }
  lastRenderedView = currentViewKey;
}

/* ------------------------------------------------------------------ */
/* Cross-app session sync (shared with the multi-page site)             */
/*                                                                      */
/* Both sites must be hosted on the SAME domain for this to work at all */
/* — localStorage is scoped strictly by origin, a browser security       */
/* boundary no code can work around. Covers current-journey/stage AND    */
/* the Activity Ledger (log + accept/dismiss responses), all via a       */
/* read-merge-write pattern so neither app's contributions get clobbered */
/* by the other's.                                                      */
/* ------------------------------------------------------------------ */
const SHARED_SESSION_KEY = "instellars_banking_session_v1";

function readSharedSession() {
  try {
    const raw = localStorage.getItem(SHARED_SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (err) {
    return null;
  }
}

function writeSharedCurrentStage(customerId, journeyId, stageIndex) {
  try {
    const existing = readSharedSession() || {};
    const merged = { ...existing, customerId, currentJourneyId: journeyId, currentStageIndex: stageIndex };
    localStorage.setItem(SHARED_SESSION_KEY, JSON.stringify(merged));
  } catch (err) {
    console.error("Failed to write shared session:", err);
  }
}

// Priya's "loan actually disbursed" fact (drives numLoanAccounts in her
// Decision Receipt) is a customer-profile mutation, not offer/ledger data —
// it was originally only applied in-memory to whichever app's own CUSTOMERS
// copy triggered it, so it never carried over to the other app during live
// cross-app sync. Persisting it here, the same way journey stage is, fixes
// that.
function writeSharedLoanDisbursed(customerId) {
  try {
    const existing = readSharedSession() || {};
    const already = existing.loanDisbursedCustomerIds || [];
    const merged = { ...existing, loanDisbursedCustomerIds: already.includes(customerId) ? already : [...already, customerId] };
    localStorage.setItem(SHARED_SESSION_KEY, JSON.stringify(merged));
  } catch (err) {
    console.error("Failed to write shared session:", err);
  }
}

// Lets Agent Desktop reuse the exact offers this app just fetched for a
// customer, instead of firing its own separate container call — same
// pattern as writeSharedCurrentStage/writeSharedLoanDisbursed above: read-
// merge-write just these three keys, not the whole shared session, since
// this app's own `state` has a different shape than the website's session
// object. Offer ids only, not full offer objects — those carry function
// properties (eligibility, propensity) that JSON.stringify would silently
// drop.
function writeSharedLastFetched(offerIds, meta) {
  try {
    const existing = readSharedSession() || {};
    const merged = { ...existing, lastFetchedOfferIds: offerIds, lastFetchedMeta: meta, lastFetchedAt: Date.now() };
    localStorage.setItem(SHARED_SESSION_KEY, JSON.stringify(merged));
  } catch (err) {
    console.error("Failed to write shared session:", err);
  }
}

// Combines two independent ledgers (this app's in-memory one, and whatever's
// in shared storage) into one, deduping by entry id and sorting newest-first
// by the raw `ts` timestamp — since each app appends independently, neither
// array alone reflects the full picture once both have been used.
function mergeLedgerData(local, shared) {
  const localLog = Array.isArray(local?.log) ? local.log : [];
  // Only meaningful cross-session facts get merged in from the other side —
  // impressions are inherently per-session noise (every fresh page load
  // naturally logs its own for whatever it's currently showing), not
  // something worth carrying across sessions. Merging them in would cause
  // runaway duplication with every sync, eventually pushing real
  // accept/dismiss entries out past the 20-item cap.
  const sharedMeaningful = Array.isArray(shared?.log) ? shared.log.filter(e => e && e.type !== "impression") : [];
  const byId = new Map();
  [...sharedMeaningful, ...localLog].forEach(entry => {
    if (entry && entry.id) byId.set(entry.id, entry);
  });
  const mergedLog = [...byId.values()].sort((a, b) => (b.ts || 0) - (a.ts || 0)).slice(0, 20);
  const mergedResponses = { ...(shared?.responses || {}), ...(local?.responses || {}) };
  return { log: mergedLog, responses: mergedResponses };
}

// Called after every accept/dismiss — merges this app's ledger with
// whatever's currently shared (in case the other app changed things since
// this session started) and writes the combined result back.
function syncLedgerToSharedSession() {
  const customer = getCustomer();
  if (!customer) return;
  try {
    const existing = readSharedSession() || {};
    const sameCustomer = existing.customerId === customer.id;
    const merged = mergeLedgerData({ log: state.log, responses: state.responses }, sameCustomer ? existing : {});
    state.log = merged.log;
    state.responses = merged.responses;
    const updated = { ...existing, customerId: customer.id, log: merged.log, responses: merged.responses };
    localStorage.setItem(SHARED_SESSION_KEY, JSON.stringify(updated));
  } catch (err) {
    console.error("Failed to sync ledger to shared session:", err);
  }
}

// Called right after login: if the multi-page site (or an earlier mobile
// session) already recorded a current journey/stage for this same
// customer, adopt it — so "where they are" carries over instead of
// starting fresh every time they open the mobile app.
function adoptSharedCurrentStage(customerId) {
  const shared = readSharedSession();
  if (!shared || shared.customerId !== customerId || !shared.currentJourneyId) return;
  const journey = getJourneyById(shared.currentJourneyId);
  if (!journeyMatchesCustomer(journey, customerId)) return;
  const stageIndex = Math.max(0, Math.min(shared.currentStageIndex || 0, journey.stages.length - 1));
  state.activeJourney = journey;
  state.journeyIndex = stageIndex;
}

// Called right after login: merges in whatever ledger history (log +
// responses) already exists for this same customer, from either an earlier
// mobile session or the multi-page website.
function adoptSharedLedgerData(customerId) {
  const shared = readSharedSession();
  if (!shared || shared.customerId !== customerId) return;
  const merged = mergeLedgerData({ log: state.log, responses: state.responses }, shared);
  state.log = merged.log;
  state.responses = merged.responses;
}

// Diego (C1004) only — pulls his journeyActionResponses jar and his cached
// container response over from the shared session, same read-merge-write
// family as the two functions above. Called from fetchOffers() (so it runs
// on login AND on every tab-switch/refresh, catching updates the website
// made since this app last checked) rather than only once at login like
// adoptSharedCurrentStage/adoptSharedLedgerData — his data can change on
// the OTHER surface at any time, not just before this app was opened.
// journeyActionResponses is merged (shared wins where local has nothing yet,
// local wins on conflict) rather than overwritten outright, so a response
// recorded here moments ago during the SAME synchronous call chain (before
// this function's own caller gets a chance to write it back) is never lost.
function adoptSharedDiegoState(customerId) {
  if (customerId !== "C1004") return;
  const shared = readSharedSession();
  if (!shared || shared.customerId !== customerId) return;
  if (shared.journeyActionResponses) {
    state.journeyActionResponses = { ...shared.journeyActionResponses, ...state.journeyActionResponses };
  }
  if (Array.isArray(shared.diegoContainerOffers)) {
    state.diegoContainerOffers = shared.diegoContainerOffers;
    state.diegoContainerMeta = shared.diegoContainerMeta || null;
  }
}

// Called after every Diego accept/dismiss — merges this app's jar with
// whatever's currently shared (in case the website changed something since
// this session started) and writes the combined result back, same
// read-merge-write pattern as syncLedgerToSharedSession.
function syncDiegoJarToSharedSession() {
  try {
    const existing = readSharedSession() || {};
    const merged = { ...(existing.journeyActionResponses || {}), ...state.journeyActionResponses };
    state.journeyActionResponses = merged;
    const updated = { ...existing, journeyActionResponses: merged };
    localStorage.setItem(SHARED_SESSION_KEY, JSON.stringify(updated));
  } catch (err) {
    console.error("Failed to sync Diego journey state:", err);
  }
}

const autoLaunchParams = new URLSearchParams(window.location.search);
const autoLaunchCustomerId = autoLaunchParams.get("customer");
if (autoLaunchCustomerId && CUSTOMERS.some(c => c.id === autoLaunchCustomerId)) {
  selectCustomer(autoLaunchCustomerId);
} else {
  render();
}

// Live cross-tab sync: the browser fires this event in THIS tab whenever a
// DIFFERENT same-origin tab (the multi-page site, or another mobile-app tab)
// writes to the shared session key — no reload needed. Only acts if the
// update is about whichever customer is currently logged in here, since the
// shared session (by the multi-page site's own design) only tracks one
// customer at a time. Ledger (log/responses) and journey/stage are synced
// independently, since either can change without the other.
window.addEventListener("storage", (event) => {
  if (event.key !== SHARED_SESSION_KEY || !event.newValue || !state.customerId) return;
  let shared;
  try {
    shared = JSON.parse(event.newValue);
  } catch (err) {
    return;
  }
  if (shared.customerId !== state.customerId) return;

  // Apply the current customer's synced "loan disbursed" fact to this
  // app's own in-memory customer object, since that mutation otherwise
  // never carries over from whichever app originally triggered it.
  if (shared.loanDisbursedCustomerIds?.includes(state.customerId)) {
    const currentCustomer = CUSTOMERS.find(c => c.id === state.customerId);
    if (currentCustomer) currentCustomer.numLoanAccounts = 1;
  }

  const mergedLedger = mergeLedgerData({ log: state.log, responses: state.responses }, shared);
  const ledgerChanged = mergedLedger.log[0]?.id !== state.log[0]?.id || mergedLedger.log.length !== state.log.length;
  state.log = mergedLedger.log;
  state.responses = mergedLedger.responses;

  let journeyChanged = false;
  if (shared.currentJourneyId) {
    const journey = getJourneyById(shared.currentJourneyId);
    if (journeyMatchesCustomer(journey, state.customerId)) {
      const stageIndex = Math.max(0, Math.min(shared.currentStageIndex || 0, journey.stages.length - 1));
      journeyChanged = !state.activeJourney || state.activeJourney.id !== journey.id || state.journeyIndex !== stageIndex;
      if (journeyChanged) {
        state.activeJourney = journey;
        state.journeyIndex = stageIndex;
        const stage = journey.stages[stageIndex];
        pushLog("system", `Journey stage updated from another session: ${journey.title} \u2014 ${stage.stage}`);
        delete state.journeyData[stage.stage];
        if (isLoanCardJourneyCustomer(state.customerId)) {
          // Loan journey customers' Home dashboard reads stage-scoped data
          // directly from state.offers (not just journeyData) —
          // fetchOffers() populates both together, the same fix applied
          // earlier when the Offers tab had this same staleness problem.
          fetchOffers();
        } else if (journey.id === "priority-banking-upgrade" || journey.id === "wealth-management" || journey.id === "digital-activation-onboarding" || journey.id === "sme-cards-payments" || journey.id === "sme-loyalty-protection" || journey.id === "sme-lending-working-capital" || journey.id === "sme-digital-banking-cashflow" || journey.id === "new-customer-acquisition" || journey.id === "in-market-card-intent" || journey.id === "in-market-loan-intent" || journey.id === "transaction-digital-deepening" || journey.id === "ofw-family") {
          // Diego, Aria, Maya, the four SME customers, Sam, Leo, Naomi, and Maria
          // have no separate guided-journey-flow fetch either — fetchOffers() itself
          // already routes them to their own stage-scoped branch, same as
          // the loan-journey branch above, and their Home dashboard also
          // reads stage-scoped data straight from state.offers.
          fetchOffers();
        } else {
          loadJourneyStage(stageIndex, true); // renders internally once data loads
        }
      }
    }
  }

  // Diego's jar/container cache can change on the OTHER surface without his
  // stage changing at all (e.g. the website registers his second mission,
  // or populates the container cache for the very first time) -
  // journeyChanged above only fires on an actual stage move, so this needs
  // its own check.
  let diegoDataChanged = false;
  if (state.customerId === "C1004" && !journeyChanged) {
    const diegoCustomer = getCustomer();
    if (shared.journeyActionResponses) {
      const mergedJar = { ...state.journeyActionResponses, ...shared.journeyActionResponses };
      if (JSON.stringify(mergedJar) !== JSON.stringify(state.journeyActionResponses)) {
        state.journeyActionResponses = mergedJar;
        diegoDataChanged = true;
      }
    }
    if (Array.isArray(shared.diegoContainerOffers) && !state.diegoContainerOffers) {
      state.diegoContainerOffers = shared.diegoContainerOffers;
      state.diegoContainerMeta = shared.diegoContainerMeta || null;
      diegoDataChanged = true;
    }
    if (diegoDataChanged && diegoCustomer) {
      state.diegoAvailableMissions = getDiegoAvailableMissions(diegoCustomer);
      state.diegoAvailableMilestones = getDiegoAvailableMilestones(diegoCustomer);
      state.diegoProgressMonitor = getDiegoProgressMonitor(diegoCustomer);
      loadDiegoOffersForCurrentStage();
    }
  }

  // loadJourneyStage()/fetchOffers() above already render once their own
  // fetch resolves - only render here ourselves if something changed that
  // neither of those already covered.
  if ((ledgerChanged || diegoDataChanged) && !journeyChanged) {
    render();
  }
});

function updatePhoneClock() {
  const el = document.getElementById("phone-clock");
  if (!el) return;
  const now = new Date();
  let h = now.getHours();
  const m = now.getMinutes().toString().padStart(2, "0");
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  el.textContent = `${h}:${m} ${ampm}`;
}
updatePhoneClock();
setInterval(updatePhoneClock, 15000);
