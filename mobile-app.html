<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Instellars — Banking CDH Demo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root {
    --ink: #0E1230;
    --ink-soft: #4E4F6E;
    --paper: #EDEDF2;
    --paper-alt: #E1E1EA;
    --white: #FFFFFF;
    --brass: #2563EB;
    --brass-soft: #DBEAFE;
    --rule: #CBCBDA;
    --danger: #8C3B34;
    --success: #3B6E52;
    --star: #8F7FE8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(circle at 50% 0%, #2A2E52, #101226 70%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 1rem;
    font-family: 'IBM Plex Sans', sans-serif;
    overflow-x: hidden;
  }
  .bnk-phone-frame {
    position: relative;
    width: 390px;
    max-width: calc(100vw - 2rem);
    height: 844px;
    max-height: calc(100vh - 3rem);
    background: #0A0A12;
    border-radius: 54px;
    padding: 14px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.55), 0 0 0 2px rgba(255,255,255,0.06) inset;
    flex-shrink: 1;
    box-sizing: border-box;
  }
  .bnk-phone-notch {
    position: absolute;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 30px;
    background: #0A0A12;
    border-radius: 0 0 20px 20px;
    z-index: 20;
  }
  .bnk-phone-home-indicator {
    position: absolute;
    bottom: 9px;
    left: 50%;
    transform: translateX(-50%);
    width: 134px;
    height: 5px;
    background: rgba(255,255,255,0.55);
    border-radius: 3px;
    z-index: 20;
  }
  .bnk-phone-screen {
    position: relative;
    width: 100%;
    height: 100%;
    background: var(--paper);
    border-radius: 42px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    container-type: inline-size;
    container-name: phone;
  }
  .bnk-phone-statusbar {
    flex-shrink: 0;
    height: 44px;
    padding: 12px 34px 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    background: var(--ink);
    color: var(--paper);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.78rem;
    font-weight: 600;
  }
  .bnk-phone-scroll {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .bnk-phone-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .bnk-bottom-tabbar {
    flex-shrink: 0;
    display: none;
    justify-content: space-around;
    align-items: center;
    padding: 0.4rem 0.2rem 1.5rem;
    background: var(--white);
    border-top: 1px solid var(--rule);
  }
  .bnk-bottom-tabbar.active { display: flex; }
  .bnk-tab-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.2rem;
    background: none;
    border: none;
    font-family: inherit;
    color: var(--ink-soft);
    font-size: 0.64rem;
    cursor: pointer;
    padding: 0.2rem 0.4rem;
  }
  .bnk-tab-item.current { color: var(--brass); font-weight: 600; }
  body.bnk-journey-active { scrollbar-width: none; -ms-overflow-style: none; }
  body.bnk-journey-active::-webkit-scrollbar { width: 0; height: 0; }
  .bnk-root {
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100%;
  }
  .bnk-display { font-family: 'Fraunces', serif; }
  .bnk-mono { font-family: 'IBM Plex Mono', monospace; }
  .bnk-icon-svg { display: inline-block; vertical-align: middle; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* ---------- Login ---------- */
  .bnk-login-wrap { display: flex; min-height: 100vh; }
  .bnk-login-left {
    background: var(--ink); color: var(--paper);
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    padding: 4rem; position: relative; overflow: hidden;
  }
  .bnk-login-left::after {
    content: ""; position: absolute; right: -60px; bottom: -60px;
    width: 260px; height: 260px; border: 1px solid rgba(237,239,242,0.12); border-radius: 50%;
  }
  .bnk-constellation { position: absolute; inset: 0; pointer-events: none; }
  .bnk-constellation circle { fill: var(--star); opacity: 0.55; }
  .bnk-constellation line { stroke: var(--star); stroke-width: 1; opacity: 0.22; }
  .bnk-brand { display: flex; align-items: center; gap: 0.6rem; color: var(--brass-soft); margin-bottom: 2.5rem; }
  .bnk-brand-word { font-family: 'Fraunces', serif; font-size: 1.15rem; letter-spacing: 0.02em; }
  .bnk-login-headline { font-size: 2.6rem; line-height: 1.15; max-width: 480px; margin: 0; }
  .bnk-login-sub { color: rgba(237,239,234,0.65); margin-top: 1.25rem; max-width: 420px; line-height: 1.6; font-size: 0.95rem; }
  .bnk-login-right {
    flex: 1; padding: 4rem; display: flex; flex-direction: column; justify-content: center;
    max-width: 560px;
  }
  .bnk-login-right-title { font-size: 1.4rem; margin-bottom: 0.35rem; }
  .bnk-login-right-sub { color: var(--ink-soft); font-size: 0.9rem; margin-bottom: 2rem; }
  .bnk-customer-card {
    display: flex; align-items: center; gap: 0.9rem; width: 100%;
    background: var(--white); border: 1px solid var(--rule); padding: 0.9rem 1.1rem;
    margin-bottom: 0.75rem; cursor: pointer; text-align: left; border-radius: 4px;
    transition: border-color 0.15s ease; font-family: inherit; color: inherit;
  }
  .bnk-customer-card:hover { border-color: var(--brass); }
  .bnk-customer-card:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .bnk-avatar {
    width: 40px; height: 40px; border-radius: 50%; background: var(--ink); color: var(--brass-soft);
    display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 600;
    flex-shrink: 0;
  }
  .bnk-customer-name { font-weight: 600; font-size: 0.95rem; }
  .bnk-customer-meta { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.25rem; flex-wrap: wrap; }
  .bnk-customer-meta-num { color: var(--ink-soft); font-size: 0.72rem; }
  .bnk-segment-pill {
    background: var(--brass-soft); color: #1E40AF; font-size: 0.68rem; padding: 0.1rem 0.5rem;
    border-radius: 20px; font-weight: 600; letter-spacing: 0.02em;
  }

  /* ---------- Dashboard ---------- */
  .bnk-header {
    background: var(--ink); color: var(--paper); position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; padding: 0.8rem 1.5rem;
    flex-wrap: wrap; gap: 0.6rem;
  }
  .bnk-header-right { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .bnk-signout-btn {
    display: flex; align-items: center; gap: 0.4rem; background: transparent; border: 1px solid rgba(237,239,234,0.25);
    color: var(--paper); padding: 0.4rem 0.8rem; border-radius: 4px; font-size: 0.8rem; cursor: pointer; font-family: inherit;
  }
  .bnk-signout-btn:hover { border-color: var(--brass-soft); }
  .bnk-body { max-width: 1100px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

  .bnk-nav-tabs { display: flex; gap: 0.3rem; padding: 0 2rem; background: var(--ink); overflow-x: auto; -webkit-overflow-scrolling: touch; position: relative; scrollbar-width: none; -ms-overflow-style: none; }
  .bnk-nav-tabs::-webkit-scrollbar { display: none; }
  .bnk-nav-tabs-wrap { position: relative; }
  .bnk-nav-tabs-fade { position: absolute; top: 0; right: 0; bottom: 0; width: 28px; pointer-events: none; background: linear-gradient(to right, rgba(14,18,48,0), var(--ink)); }
  .bnk-nav-tab { background: none; border: none; color: rgba(237,239,242,0.6); font-family: inherit; font-size: 0.85rem; padding: 0.7rem 0.9rem; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
  .bnk-nav-tab.active { color: var(--paper); border-bottom-color: var(--star); font-weight: 600; }
  .bnk-nav-tab:hover:not(.active) { color: var(--paper); }

  .bnk-greeting { font-size: 1.15rem; margin-bottom: 1.3rem; }
  .bnk-greeting .bnk-name-accent { color: var(--brass); }

  .bnk-dashboard-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 1.5rem; align-items: start; margin-bottom: 2rem; }
  .bnk-main-col { display: flex; flex-direction: column; gap: 1.25rem; min-width: 0; }
  .bnk-side-col { display: flex; flex-direction: column; gap: 1.25rem; }

  .bnk-hero-account { background: linear-gradient(135deg, var(--ink), #1c2560); color: var(--paper); border-radius: 8px; padding: 0.9rem 1rem; }
  .bnk-hero-top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap; gap: 0.4rem; }
  .bnk-hero-type { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(237,239,242,0.65); }
  .bnk-hero-active-pill { background: rgba(143,127,232,0.25); color: var(--star); font-size: 0.6rem; padding: 0.15rem 0.55rem; border-radius: 20px; font-weight: 600; flex-shrink: 0; white-space: nowrap; }
  .bnk-hero-label { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.1rem; }
  .bnk-hero-masked { font-size: 0.7rem; color: rgba(237,239,242,0.55); margin-bottom: 0.55rem; }
  .bnk-hero-balance-label { font-size: 0.64rem; color: rgba(237,239,242,0.6); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.2rem; }
  .bnk-hero-balance-value { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.65rem; }
  .bnk-hero-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .bnk-hero-action-btn { display: flex; flex-direction: column; align-items: center; gap: 0.25rem; background: rgba(237,239,242,0.1); border: 1px solid rgba(237,239,242,0.2); color: var(--paper); padding: 0.35rem 0.6rem; border-radius: 6px; font-size: 0.64rem; cursor: pointer; font-family: inherit; flex: 1; min-width: 68px; }
  .bnk-hero-action-btn:hover { background: rgba(237,239,242,0.18); }

  .bnk-account-card { background: var(--white); border: 1px solid var(--rule); border-radius: 8px; padding: 1.1rem 1.3rem; }

  .bnk-application-card { background: var(--white); border: 1px dashed var(--brass); border-radius: 8px; padding: 1.1rem 1.3rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .bnk-application-card-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--brass-soft); color: #1E40AF; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .bnk-application-card-title { font-weight: 600; font-size: 0.98rem; margin-bottom: 0.15rem; }
  .bnk-application-card-sub { font-size: 0.82rem; color: var(--ink-soft); }

  .bnk-form-group { margin-bottom: 1.1rem; }
  .bnk-form-label { display: block; font-size: 0.78rem; font-weight: 600; color: var(--ink-soft); margin-bottom: 0.35rem; }
  .bnk-form-input, .bnk-form-select { width: 100%; padding: 0.6rem 0.8rem; border: 1px solid var(--rule); border-radius: 4px; font-family: inherit; font-size: 0.88rem; color: var(--ink); background: var(--white); }
  .bnk-form-input:focus, .bnk-form-select:focus { outline: none; border-color: var(--brass); }
  .bnk-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .bnk-application-panel { background: var(--white); border: 1px solid var(--rule); border-radius: 8px; padding: 1.5rem; max-width: 560px; margin: 0 auto; }

  .bnk-transition-step { display: flex; gap: 0.85rem; }
  .bnk-transition-iconcol { display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
  .bnk-transition-icon { width: 34px; height: 34px; border-radius: 50%; background: var(--brass-soft); color: #1E40AF; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .bnk-transition-line { width: 2px; flex: 1; background: var(--rule); margin: 0.3rem 0; min-height: 0.6rem; }
  .bnk-transition-body { padding-bottom: 1.1rem; }
  .bnk-transition-label { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.25rem; }
  .bnk-transition-detail { font-size: 0.82rem; color: var(--ink-soft); line-height: 1.5; }
  .bnk-application-actions { display: flex; justify-content: space-between; gap: 0.75rem; margin-top: 1.5rem; }

  .bnk-confirmation-wrap { text-align: center; padding: 1rem 0 0.5rem; }
  .bnk-confirmation-icon { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.2rem; }
  .bnk-confirmation-icon.success { background: #E4EEE7; color: var(--success); }
  .bnk-confirmation-icon.muted { background: var(--paper-alt); color: var(--ink-soft); }
  .bnk-confirmation-title { font-size: 1.3rem; margin-bottom: 0.5rem; }
  .bnk-confirmation-sub { color: var(--ink-soft); font-size: 0.9rem; margin-bottom: 1.5rem; }
  .bnk-account-type { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin-bottom: 0.3rem; }
  .bnk-account-label { font-weight: 600; font-size: 0.98rem; margin-bottom: 0.15rem; }
  .bnk-account-masked { font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 0.6rem; }
  .bnk-account-balance-label { font-size: 0.72rem; color: var(--ink-soft); margin-bottom: 0.2rem; }
  .bnk-account-balance-value { font-size: 1.2rem; font-weight: 600; }
  .bnk-account-maturity { font-size: 0.76rem; color: var(--ink-soft); display: flex; align-items: center; gap: 0.35rem; margin-top: 0.4rem; }

  .bnk-txn-section { background: var(--white); border: 1px solid var(--rule); border-radius: 8px; padding: 1.2rem 1.3rem; }
  .bnk-txn-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; flex-wrap: wrap; gap: 0.4rem; }
  .bnk-txn-header-title { font-weight: 600; font-size: 1rem; }
  .bnk-txn-view-all { font-size: 0.8rem; color: var(--brass); text-decoration: none; cursor: pointer; background: none; border: none; font-family: inherit; display: flex; align-items: center; gap: 0.2rem; }
  .bnk-txn-row { display: flex; align-items: center; gap: 0.8rem; padding: 0.7rem 0; border-top: 1px solid var(--paper-alt); }
  .bnk-txn-row:first-of-type { border-top: none; }
  .bnk-txn-icon { width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .bnk-txn-icon.debit { background: #F7E3DE; color: var(--danger); }
  .bnk-txn-icon.credit { background: #E1F0E5; color: var(--success); }
  .bnk-txn-icon.muted { background: #ECECEC; color: var(--ink-soft); }
  .bnk-txn-icon.warn { background: #F7E3DE; color: var(--danger); }
  .bnk-txn-icon.info { background: var(--brass-soft); color: #1E40AF; }
  .bnk-txn-amount-neutral { color: var(--ink-soft); font-weight: 500; }
  .bnk-txn-name { font-weight: 600; font-size: 0.88rem; }
  .bnk-txn-meta { font-size: 0.75rem; color: var(--ink-soft); }
  .bnk-txn-amount { margin-left: auto; font-weight: 600; font-size: 0.9rem; }
  .bnk-txn-amount.debit { color: var(--danger); }
  .bnk-txn-amount.credit { color: var(--success); }

  .bnk-sidebar-panel { background: var(--white); border: 1px solid var(--rule); border-radius: 8px; padding: 1rem 1.1rem; }
  .bnk-sidebar-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.85rem; flex-wrap: wrap; gap: 0.4rem; }
  .bnk-sidebar-panel-title { font-weight: 600; font-size: 0.92rem; display: flex; align-items: center; gap: 0.4rem; min-width: 0; }
  .bnk-engine-badge { background: var(--brass-soft); color: #1E40AF; font-size: 0.62rem; font-weight: 600; padding: 0.2rem 0.55rem; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
  .bnk-sidebar-offers-stack { display: flex; flex-direction: column; gap: 1rem; }
  .bnk-sidebar-note { font-size: 0.72rem; color: var(--ink-soft); text-align: center; margin-top: 0.9rem; font-style: italic; }


  .bnk-stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2.5rem; }
  .bnk-tile { background: var(--white); border: 1px solid var(--rule); padding: 1.1rem 1.3rem; border-radius: 4px; }
  .bnk-tile-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-soft); margin-bottom: 0.4rem; }
  .bnk-tile-value { font-size: 1.5rem; font-weight: 600; }
  .bnk-tile-sub { font-size: 0.75rem; color: var(--ink-soft); margin-top: 0.2rem; }

  .bnk-section-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.75rem; }
  .bnk-section-title { font-size: 1.5rem; margin: 0; }
  .bnk-section-sub { color: var(--ink-soft); font-size: 0.85rem; margin-top: 0.15rem; }
  .bnk-section-controls { display: flex; align-items: center; gap: 0.6rem; }
  .bnk-live-badge {
    display: flex; align-items: center; gap: 0.35rem; font-size: 0.75rem; padding: 0.3rem 0.6rem;
    border-radius: 20px; border: 1px solid var(--rule); background: var(--white);
  }
  .bnk-live-badge.live { color: var(--success); }
  .bnk-live-badge.down { color: var(--danger); }
  .bnk-icon-btn {
    display: flex; align-items: center; gap: 0.35rem; background: var(--white); border: 1px solid var(--rule);
    padding: 0.35rem 0.7rem; border-radius: 4px; font-size: 0.78rem; cursor: pointer; color: var(--ink); font-family: inherit;
  }
  .bnk-icon-btn:hover { border-color: var(--brass); }
  .bnk-icon-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .bnk-info-callout {
    display: flex; gap: 0.7rem; background: var(--white); border: 1px dashed var(--rule);
    padding: 0.9rem 1.1rem; border-radius: 4px; margin-bottom: 1.5rem; font-size: 0.82rem; color: var(--ink-soft);
    align-items: flex-start;
  }
  .bnk-info-callout button { margin-left: auto; background: none; border: none; cursor: pointer; color: var(--ink-soft); flex-shrink: 0; padding: 0; }

  .bnk-offers-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 2.5rem; }
  .bnk-offers-grid-journey { grid-template-columns: repeat(auto-fit, minmax(260px, 320px)); justify-content: center; }
  .bnk-card { background: var(--white); border: 1px solid var(--rule); border-radius: 16px; padding: 1.3rem; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .bnk-card-compact { padding: 0.55rem; }
  .bnk-card-compact .bnk-card-image { display: block; width: calc(100% + 1.1rem); height: 80px; margin: -0.55rem -0.55rem 0.5rem; border-radius: 4px 4px 0 0; object-position: top; }
  .bnk-card-compact .bnk-eyebrow-row { display: none; }
  .bnk-card-compact .bnk-icon-badge { width: 20px; height: 20px; }
  .bnk-card-compact .bnk-card-title { font-size: 0.82rem; line-height: 1.1; }

// Derives a simple multi-account view for the dashboard's hero + secondary
// account cards. Purely presentational/mock — not tied to CDH decisioning.
function getAccountsForCustomer(customer) {
  const idNum = parseInt(customer.id.replace(/\D/g, ""), 10) || 1000;
  const mask = n => String(n % 10000).padStart(4, "0");
  const accounts = [
    { type: "SAVINGS", label: "EasyFlow Savings", masked: `•••• •••• ${mask(idNum)}`, balance: customer.balance, active: true },
  ];
  if (customer.id === PRIYA_CUSTOMER_ID) return accounts; // Priya: Savings only — Checking and Time Deposit hidden
  if (customer.holdings.includes("checking")) {
    accounts.push({ type: "CHECKING", label: "Instellars Checking", masked: `•••• •••• ${mask(idNum + 11)}`, balance: +(customer.balance * 0.12).toFixed(2) });
  }
  if (customer.holdings.includes("savings") || customer.tenureYears >= 2) {
    // Aria's Time Deposit deliberately matures 10 days out from whenever
    // this is actually viewed, rather than the fixed "2027-03-15" everyone
    // else's shows — explicit request, computed relative to today so the
    // "about to mature" framing stays true no matter when this demo runs,
    // instead of quietly becoming a date in the past.
    const maturity = customer.id === "CUST101"
      ? new Date(Date.now() + 10 * 24 * 60 * 60 * 1000).toISOString().slice(0, 10)
      : "2027-03-15";
    accounts.push({ type: "TIME DEPOSIT", label: "Horizon Time Deposit", masked: `•••• •••• ${mask(idNum + 23)}`, balance: null, maturity, rate: "4.75% p.a." });
  }
  return accounts;
}

// Every action title across all journeys assigned to this customer (flattened,
// normalized). Used to keep the dashboard's "Recommended for you" rail scoped
// to actions that actually belong to the customer's own journey(s) — since the
// live CDH path maps whatever the container returns without re-applying local
// eligibility, this is the safety net that prevents e.g. another customer's
// journey action from showing up if the real backend doesn't fully
// differentiate by SubjectID.
function getJourneyActionTitleSet(customer) {
  const titles = new Set();
  getJourneysForCustomer(customer).forEach(j => {
    j.stages.forEach(s => s.actions.forEach(a => titles.add(normalizeActionTitle(a))));
  });
  return titles;
}

// Normalizes an action title for matching so minor formatting differences from
// CDH (extra whitespace, spacing around "/", casing) don't break the stage
// mapping derived from the source journey images.
function normalizeActionTitle(title) {
  return (title || "")
    .toLowerCase()
    .trim()
    .replace(/\s*\/\s*/g, "/")
    .replace(/\s+/g, " ");
}

// Given CDH's raw (deduped) offers for a container call, returns only the ones
// that belong to the given journey stage.
function filterOffersForStage(offers, stage) {
  const knownTitles = stage.actions.map(normalizeActionTitle);
  return offers.filter(o => knownTitles.includes(normalizeActionTitle(o.title)));
}

// Given any offer (from the dashboard rail, mock or live), finds which stage
// of ANY registered journey it belongs to, if any — matched by title against
// the source journey images, independent of the offer's own category/Issue
// field (which may not reflect the actual journey stage).
function findJourneyStageForOffer(offer) {
  for (const journey of JOURNEYS) {
    const stage = journey.stages.find(s => s.actions.some(a => normalizeActionTitle(a) === normalizeActionTitle(offer.title)));
    if (stage) return stage.stage;
  }
  return null;
}

// Reorders offers to follow the customer's journey stage sequence (Awareness
// before Consideration before Conversion, etc.) rather than raw CDH/mock
// priority. Priority still determines WHICH offers are selected (this only
// reorders whatever's already been chosen) — and still breaks ties within
// the same stage. Offers not tied to any of the customer's journey stages
// (e.g. generic catalog items) sort to the end, in their original order.
function sortOffersByJourneyStage(offers, customer) {
  const journeys = getJourneysForCustomer(customer);
  if (journeys.length === 0) return offers;

  const stageIndexByTitle = new Map();
  journeys.forEach(journey => {
    journey.stages.forEach((stage, idx) => {
      stage.actions.forEach(actionTitle => {
        const key = normalizeActionTitle(actionTitle);
        if (!stageIndexByTitle.has(key)) stageIndexByTitle.set(key, idx);
      });
    });
  });

  return [...offers].sort((a, b) => {
    const idxA = stageIndexByTitle.has(normalizeActionTitle(a.title)) ? stageIndexByTitle.get(normalizeActionTitle(a.title)) : Infinity;
    const idxB = stageIndexByTitle.has(normalizeActionTitle(b.title)) ? stageIndexByTitle.get(normalizeActionTitle(b.title)) : Infinity;
    if (idxA !== idxB) return idxA - idxB;
    return (b.priority ?? 0) - (a.priority ?? 0);
  });
}

function scoreOffers(offers, customer) {
  const eligible = offers.filter(o => o.eligibility(customer));
  const scored = eligible.map(o => {
    const propensityValue = o.propensity(customer);
    const priority = +(propensityValue * o.businessValue * o.urgency).toFixed(2);
    return { ...o, propensityValue, priority };
  });
  scored.sort((a, b) => b.priority - a.priority);
  return scored.map((o, i) => ({ ...o, rank: i + 1, ofTotal: scored.length }));
}

// No auth required for this instance. Request body shape confirmed against a
// real Postman call. Response shape confirmed against a real sample payload —
// see mapPegaOffer below for the exact fields used.
async function simulateCDHRequest(customer, { containerName = "NextBestAction", channel = "Mobile", subjectId, direction = CDH_DIRECTION, placement } = {}) {
  const startedAt = Date.now();

  const requestBody = {
    SubjectID: subjectId || customer.id,
    ContextName: CDH_CONTEXT_NAME,
    ContainerName: containerName,
    Channel: channel,
    Direction: direction,
    AppID: CDH_APP_ID,
  };
  if (placement) {
    requestBody.Placement = placement;
  }

  const response = await fetch(CDH_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(requestBody),
  });

  if (!response.ok) {
    throw new Error(`CDH request failed: ${response.status} ${response.statusText}`);
  }

  const data = await response.json();
  if (data.Status !== "OK") {
    throw new Error(`CDH returned non-OK status: ${data.Status}`);
  }

  const container = data.ContainerList?.[0];
  const rawOffers = dedupeByName(container?.RankedResults || []);
  const offers = rawOffers.map((o, i) => mapPegaOffer(o, i, rawOffers.length));

  return {
    offers,
    meta: {
      strategy: container?.ContainerName || containerName,
      channel,
      placement: containerName,
      latencyMs: Date.now() - startedAt,
      subjectId: subjectId || customer.id,
      direction,
    },
  };
}

// Pega can return the same offer multiple times if it's eligible across more
// than one channel (e.g. once for Mobile, once for Web) — collapse those down
// to a single entry, keeping whichever instance has the higher Priority, and
// re-rank the deduped list so Rank/ofTotal reflect the collapsed set.
function dedupeByName(rawOffers) {
  const byName = new Map();
  rawOffers.forEach((o, i) => {
    const key = (o.Name && o.Name.trim()) || (o.Label && o.Label.trim()) || `__unnamed_${i}`;
    const existing = byName.get(key);
    if (!existing || (o.Priority ?? 0) > (existing.Priority ?? 0)) {
      byName.set(key, o);
    }
  });
  const deduped = Array.from(byName.values());
  deduped.sort((a, b) => (b.Priority ?? 0) - (a.Priority ?? 0));
  return deduped.map((o, i) => ({ ...o, Rank: i + 1 }));
}

function mapIconForGroup(group = "", issue = "") {
  const g = `${group} ${issue}`.toLowerCase();
  if (g.includes("wealth")) return "landmark";
  if (g.includes("credit") || g.includes("card")) return "creditCard";
  if (g.includes("saving")) return "piggyBank";

// A real container response's EligibilityDescription/ApplicabilityDescription/
// SuitabilityDescription field isn't just this one offer's rule text — it's
// the ENTIRE proposition-filter rule table's raw Pega export (every row,
// i.e. every offer in that Issue/Group), confirmed by calling the live API
// directly: Aria's FD Maturity Reinvestment and Tax-Optimisation Reminder
// offers came back with byte-identical EligibilityDescription values, each
// containing every row in the WealthandInvestment filter. Each row is
// tagged with the offer's own Pega Name (<pyName>) immediately before its
// own <pyDescription> condition markup, so this scopes to the segment
// starting at this offer's own <pyName> marker before grabbing the next
// <pyDescription> — grabbing the first one in the field unconditionally
// would silently show a sibling offer's rule instead of this offer's own.
function extractRuleDescriptionForOffer(rawField, offerName) {
  if (Array.isArray(rawField)) return rawField; // already-structured shape — nothing to extract
  if (typeof rawField !== "string" || !rawField) return null;
  if (!rawField.includes("<pyDescription>")) return rawField; // already a bare rule-text fragment, not the full table export
  const marker = `<pyName>${offerName}</pyName>`;
  const idx = rawField.indexOf(marker);
  if (idx === -1) return null;
  const match = rawField.slice(idx).match(/<pyDescription>([\s\S]*?)<\/pyDescription>/);
  if (!match) return null;
  // The row's own condition markup comes back double-escaped (HTML embedded
  // as text inside an outer XML document) — decode one level so
  // parseRuleConditionsHtml below sees the same raw
  // "<li class='condition-row'>..." shape it already expects from RULE_TEXT.
  return match[1].replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&");
}

function mapPegaOffer(o, index, total) {
  // Require something resembling an actual domain, not just a bare scheme
  // (rejects junk like the "www." placeholder seen in earlier sample data).
  const validRemoteImage = typeof o.ImageURL === "string" && /^https?:\/\/.+\..+/.test(o.ImageURL);
  const ownIllustration = findIllustrationByTitle(o.Label);
  // Name should be CDH's stable identifier for this action, but real sandbox
  // responses don't always populate it consistently. An empty id still
  // renders fine (nothing else depends on it), but silently breaks anything
  // that keys off it later (e.g. the dashboard's Activity Ledger filter, or
  // tracking responses) — so never let it come back blank.
  const id = (o.Name && o.Name.trim()) || (o.Label && o.Label.trim()) || `offer-${index}`;
  return {
    id,
    title: o.Label,
    category: o.Issue || o.Group,
    description: o.ShortDescription,
    icon: mapIconForGroup(o.Group, o.Issue),
    // Prefer our own known-good illustration when we have one for this title —
    // it's guaranteed to render — and only fall back to Pega's ImageURL when
    // we don't recognize the action. A broken/unreachable remote image is
    // worse than a working local one.
    image: ownIllustration || (validRemoteImage ? o.ImageURL : null),
    treatmentId: o.Treatment,
    group: o.Group,
    interactionID: o.InteractionID,
    decisionTime: o.DecisionTime,
    // Arbitration inputs, mapped from this demo's container response field
    // names (see computeArbitrationScore above for how these five feed into
    // the Decision Receipt's Arbitration section): Priority Score <-
    // Priority, Propensity <- Variant, Context Weight <- ProductCategory,
    // Value <- OfferValue, Lever <- ProductDescription. Not forced to
    // numbers here — computeArbitrationScore coerces defensively with a
    // sensible fallback, since a real response's field isn't guaranteed to
    // always come back parseable.
    priority: o.Priority,
    propensityValue: o.Variant ?? o.Propensity,
    contextWeight: o.ProductCategory,
    value: o.OfferValue,
    lever: o.ProductDescription,
    // Placeholders for a real container response's own rule-trace data —
    // see explainOffer() below. The realistic shape is a single opaque
    // STRING per layer — Pega's own pyDescription-style rendered HTML,
    // parsed and evaluated client-side against the actual customer — but
    // a pre-structured array of already-evaluated {conditionLabel, label,
    // pass} entries is also accepted (rulesToChecks(), below), in case a
    // future API extension hands back structured data directly instead
    // of text. null here since this demo's container response doesn't
    // actually include either shape yet.
    eligibilityDescription: extractRuleDescriptionForOffer(o.EligibilityDescription, o.Name),
    applicabilityDescription: extractRuleDescriptionForOffer(o.ApplicabilityDescription, o.Name),
    suitabilityDescription: extractRuleDescriptionForOffer(o.SuitabilityDescription, o.Name),
    // Unlike the three above, ContactPolicyDescription isn't a per-offer
    // rule-table export — confirmed live (2026-08) it changed format to a
    // flat <pxPage><pxResults>...<rowdata> list of contact-policy rule
    // instances (CP-IMPR-G-7D / CP-ACPT-G-7D / CP-REJ-G-7D). Passed through
    // raw; parseContactPolicyDescription does the actual parsing.
    contactPolicyDescription: o.ContactPolicyDescription,
    // The interest rate used to require its own separate call to a
    // dedicated lending CDH instance (fetchPriyaInterestRate, since
    // removed) — Pega now returns it directly on the offer itself in the
    // main container response, so it's just mapped here like every other
    // field instead.
    offeredRate: (o.OfferedRate != null && !isNaN(parseFloat(o.OfferedRate))) ? parseFloat(o.OfferedRate) : null,
    cta: "View offer",
    rank: o.Rank ?? index + 1,
    ofTotal: total,
  };
}

/* Diego Alvarez — Priority Banking Upgrade campaign (C1004)            */
/*                                                                      */
/* Ported from js/cdh.js (the website's own copy, already through many  */
/* rounds of bug fixes — DEVELOPER_HANDOVER.md §45–§74) and adapted to   */
/* this file's own state model: session.journeyActionResponses becomes  */
/* state.journeyActionResponses, session.diegoContainerOffers becomes    */
/* state.diegoContainerOffers — both kept in sync with the website via   */
/* the shared-session read-merge-write mechanism (further down this      */
/* file) rather than each surface keeping an independent copy that could */
/* drift. Deliberately never calls the Container API itself —            */
/* state.diegoContainerOffers is only ever adopted from whatever the     */
/* website already cached there (ensureDiegoContainerOffers, js/cdh.js,  */
/* called once per session, at login, on that surface only). If Diego    */
/* opens this app before ever visiting the website, these panels simply  */
/* stay empty until he does — no local fallback, no independent fetch,   */
/* by design (mirrors the website's own §52 "no fallback" rule and       */
/* agent-desktop.html's §74 fix, made for the identical reason).         */
/* ------------------------------------------------------------------ */

const DIEGO_CTA_OVERRIDES = {
  [normalizeActionTitle("Register to Win Exciting Gifts")]: "Play Game",
  [normalizeActionTitle("Bank More with Us")]: "Register",
  [normalizeActionTitle("Spread the Word")]: "Register",
  [normalizeActionTitle("Upgrade to Priority Banking")]: "Upgrade",
  [normalizeActionTitle("Refer Your Buddy")]: "Refer",
  [normalizeActionTitle("This Is Your First Scratch Card")]: "Scratch",
  [normalizeActionTitle("Your Second Scratch Card, Keep It Up")]: "Scratch",
  [normalizeActionTitle("Your Third Scratch Card, Looks Like You're a Pro")]: "Fulfillment Info",
  [normalizeActionTitle("More Info on How Points Can Be Redeemed")]: "View Details",
  [normalizeActionTitle("Travel Expense Categories That Qualify for Your Cashback Voucher")]: "View Details",
};

const DIEGO_FULFIL_TITLES = [
  "More Info on How Points Can Be Redeemed",
  "Travel Expense Categories That Qualify for Your Cashback Voucher",
].map(normalizeActionTitle);

const SCRATCH_CARD_ORDER = [
  "This Is Your First Scratch Card",
  "Your Second Scratch Card, Keep It Up",
  "Your Third Scratch Card, Looks Like You're a Pro",
].map(normalizeActionTitle);
function sortDiegoScratchCards(offers) {
  const norm = normalizeActionTitle;
  const isScratchCard = o => SCRATCH_CARD_ORDER.includes(norm(o.title));
  const ordered = offers
    .filter(isScratchCard)
    .sort((a, b) => SCRATCH_CARD_ORDER.indexOf(norm(a.title)) - SCRATCH_CARD_ORDER.indexOf(norm(b.title)));
  let i = 0;
  return offers.map(o => (isScratchCard(o) ? ordered[i++] : o));
}

// Looks up a single offer by title from Diego's cached one-time container
// response (adopted from the shared session — see adoptSharedDiegoState
// below). Applies DIEGO_CTA_OVERRIDES here too, so every caller gets the
// right button label regardless of which code path served the offer.
function getDiegoContainerOfferByTitle(title) {
  if (!Array.isArray(state.diegoContainerOffers)) return null;
  const key = normalizeActionTitle(title);
  const offer = state.diegoContainerOffers.find(o => normalizeActionTitle(o.title) === key) || null;
  if (!offer) return null;
  const override = DIEGO_CTA_OVERRIDES[key];
  return override ? { ...offer, cta: override } : offer;
}

function applyPriorityBankingCampaignAdjustments(offers, stage) {
  const norm = normalizeActionTitle;
  const jar = state.journeyActionResponses;

  const BANK_MORE = "Bank More with Us";
  const SPREAD_WORD = "Spread the Word";
  const UPGRADE = "Upgrade to Priority Banking";
  const INVEST = "Open a New Investment Account";
  const REFER_BUDDY = "Refer Your Buddy";
  const TRACK_PROGRESS = "Track Your Progress";
  const MISSION_COMPLETED = "Mission Completed";
  const TRACK_PROGRESS_SPREAD = "Track Your Progress for Spread the Word";
  const MISSION_COMPLETED_SPREAD = "Mission Completed Spread the Word";
  const SCRATCH_1 = "This Is Your First Scratch Card";
  const SCRATCH_2 = "Your Second Scratch Card, Keep It Up";
  const SCRATCH_3 = "Your Third Scratch Card, Looks Like You're a Pro";
  const WIN_500 = "500 Points Earned";
  const WIN_2000 = "2000 Points Earned";
  const WIN_CASHBACK = "You Have a 3% Cashback Voucher on Travel Spends";

  const bankMoreAccepted = jar[norm(BANK_MORE)] === "accepted";
  const spreadWordAccepted = jar[norm(SPREAD_WORD)] === "accepted";
  const bankMoreComplete = bankMoreAccepted && [UPGRADE, INVEST].every(t => jar[norm(t)] === "accepted");
  const spreadWordComplete = spreadWordAccepted && jar[norm(REFER_BUDDY)] === "accepted";
  const missionCompletedAccepted = jar[norm(MISSION_COMPLETED)] === "accepted";
  const missionCompletedSpreadAccepted = jar[norm(MISSION_COMPLETED_SPREAD)] === "accepted";
  const firstScratchAccepted = jar[norm(SCRATCH_1)] === "accepted";
  const secondScratchAccepted = jar[norm(SCRATCH_2)] === "accepted";
  const thirdScratchAccepted = jar[norm(SCRATCH_3)] === "accepted";

  function autoResolve(title) {
    const key = norm(title);
    if (jar[key] === undefined) jar[key] = "dismissed";
  }

  let result = offers;

  if (stage?.stage === "Engage") {
    if (!bankMoreAccepted) { autoResolve(UPGRADE); autoResolve(INVEST); }
    if (!spreadWordAccepted) autoResolve(REFER_BUDDY);
    result = result.filter(o => {
      const key = norm(o.title);
      if (key === norm(UPGRADE) || key === norm(INVEST)) return bankMoreAccepted;
      if (key === norm(REFER_BUDDY)) return spreadWordAccepted;
      return true;
    });
  }

  if (stage?.stage === "Earn") {
    if (!bankMoreComplete) autoResolve(MISSION_COMPLETED);
    if (!spreadWordComplete) autoResolve(MISSION_COMPLETED_SPREAD);
    result = result.filter(o => {
      const key = norm(o.title);
      if (key === norm(TRACK_PROGRESS) || key === norm(TRACK_PROGRESS_SPREAD)) return false;
      if (key === norm(MISSION_COMPLETED)) return bankMoreComplete;
      if (key === norm(MISSION_COMPLETED_SPREAD)) return spreadWordComplete;
      return true;
    });
  }

  if (stage?.stage === "Scratch & Win") {
    if (!missionCompletedAccepted) { autoResolve(SCRATCH_1); autoResolve(SCRATCH_2); autoResolve(WIN_500); autoResolve(WIN_2000); }
    if (!missionCompletedSpreadAccepted) { autoResolve(SCRATCH_3); autoResolve(WIN_CASHBACK); }
    result = result.filter(o => {
      const key = norm(o.title);
      if (key === norm(SCRATCH_1) || key === norm(SCRATCH_2)) return missionCompletedAccepted;
      if (key === norm(SCRATCH_3)) return missionCompletedSpreadAccepted;
      if (key === norm(WIN_500)) return firstScratchAccepted;
      if (key === norm(WIN_2000)) return secondScratchAccepted;
      if (key === norm(WIN_CASHBACK)) return thirdScratchAccepted;
      return true;
    });
  }

  result = sortDiegoScratchCards(result).map(o => {
    const override = DIEGO_CTA_OVERRIDES[norm(o.title)];
    return override ? { ...o, cta: override } : o;
  });
  return result;
}

function getDiegoAvailableMissions(customer) {
  if (!customer) return [];
  const norm = normalizeActionTitle;
  const jar = state.journeyActionResponses;
  return ["Bank More with Us", "Spread the Word"]
    .filter(t => jar[norm(t)] === undefined)

// Mirrors notifyDiegoMissionCompletedIfNewlyEligible (js/cdh.js) — fires
// "pega_nba_mission_comp" the moment a Mission Completed card first becomes
// eligible (its mission's last required Engage action gets accepted), not
// when the card itself is later accepted/dismissed. The dedup flag is
// synced through the SAME shared session as the jar (syncDiegoJarToSharedSession)
// rather than kept only in local `state`, so opening this same session on
// the website too — which checks/sets the same flag on its side — doesn't
// fire the event twice for the same mission.
function notifyDiegoMissionCompletedIfNewlyEligible(customer) {
  if (!customer) return;
  const norm = normalizeActionTitle;
  const jar = state.journeyActionResponses;
  const bankMoreComplete = ["Upgrade to Priority Banking", "Open a New Investment Account"].every(t => jar[norm(t)] === "accepted");
  const spreadWordComplete = jar[norm("Refer Your Buddy")] === "accepted";
  const shared = readSharedSession() || {};
  const notified = { ...(shared.diegoMissionCompletedNotified || {}) };
  const toNotify = [];
  if (bankMoreComplete && !notified[norm("Mission Completed")]) toNotify.push("Mission Completed");
  if (spreadWordComplete && !notified[norm("Mission Completed Spread the Word")]) toNotify.push("Mission Completed Spread the Word");
  if (toNotify.length === 0) return;
  toNotify.forEach(t => { notified[norm(t)] = true; });
  localStorage.setItem(SHARED_SESSION_KEY, JSON.stringify({ ...shared, diegoMissionCompletedNotified: notified }));
  toNotify.forEach(title => {
    triggerBrevoDecisionEvent(customer, "pega_nba_mission_comp").then((result) => {
      if (result.status === "ok") {
        pushLog("system", `Brevo event sent for ${customer.name} — "pega_nba_mission_comp" (${title} — now available)`, state.activeJourney?.id || null);
      } else {
        pushLog("system", `Brevo event failed for ${customer.name} — "pega_nba_mission_comp": ${result.error}`, state.activeJourney?.id || null);
        console.error("Brevo event failed:", result.error);
      }
      render();
    });
  });
}

// Diego's own stage-advance rules — ported from js/session.js's
// maybeAdvanceJourneyStage (the website's copy), same title-matching and
// completion logic, adapted to this file's state model
// (state.journeyActionResponses instead of session.journeyActionResponses,
// state.activeJourney/state.journeyIndex instead of
// session.currentJourneyId/currentStageIndex). Called from this file's own
// maybeAdvanceJourneyStage(offer, status) below.
function maybeAdvanceDiegoStage(offer, status) {
  const norm = normalizeActionTitle;
  const stageIndex = state.journeyIndex;
  const stage = state.activeJourney.stages[stageIndex];
  if (!stage) return false;
  const isCurrentStageOffer = stage.actions.some(a => norm(a) === norm(offer.title));
  if (!isCurrentStageOffer) return false;
  const jar = state.journeyActionResponses;

  let shouldAdvance;
  if (stage.stage === "Register") {
    // Registering for EITHER mission is enough to move into Engage — the
    // other, if left untouched, surfaces later via Pending Missions rather
    // than blocking here.
    shouldAdvance = status === "accepted";
  } else if (stage.stage === "Engage") {
    if (status !== "accepted") return false;
    const bankMoreComplete = ["Upgrade to Priority Banking", "Open a New Investment Account"].every(t => jar[norm(t)] === "accepted");
    const spreadWordComplete = jar[norm("Refer Your Buddy")] === "accepted";
    shouldAdvance = bankMoreComplete || spreadWordComplete;
  } else if (stage.stage === "Earn") {
    const missionCompletedTitles = ["Mission Completed", "Mission Completed Spread the Word"].map(norm);
    shouldAdvance = status === "accepted" && missionCompletedTitles.includes(norm(offer.title));
  } else if (stage.stage === "Scratch & Win") {
    if (status !== "accepted") return false;
    const bankMoreComplete = ["Upgrade to Priority Banking", "Open a New Investment Account"].every(t => jar[norm(t)] === "accepted");
    const spreadWordComplete = jar[norm("Refer Your Buddy")] === "accepted";
    const allScratched = SCRATCH_CARD_ORDER.every(t => jar[t] === "accepted");
    shouldAdvance = bankMoreComplete && spreadWordComplete && allScratched;
  } else {
    // Discover and Fulfil: advance only once every action in the stage has
    // a recorded response (Discover has just the one, so a single accept
    // is enough; Fulfil is the last stage, so this never actually fires
    // again once shouldAdvance is checked against stages.length below).
    if (status !== "accepted" && status !== "dismissed") return false;
    shouldAdvance = stage.actions.every(a => jar[norm(a)] !== undefined);
  }
  if (!shouldAdvance) return false;
  if (stageIndex >= state.activeJourney.stages.length - 1) return false;
  state.journeyIndex = stageIndex + 1;
  writeSharedCurrentStage(state.customerId, state.activeJourney.id, state.journeyIndex);
  return true;
}

// of a raw id (e.g. for the subjectId used in a journey's CDH call). Checks

function pushLog(type, text, journeyId = null, offerId = null) {
  const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  state.log = [{ id: Math.random().toString(36).slice(2), ts: Date.now(), type, text, time, journeyId, offerId }, ...state.log].slice(0, 20);
}

// Finds an offer by id regardless of where it currently lives — the
// dashboard's rail (state.offers) or any journey stage's cached results
// (state.journeyData) — since the same `respond()` handler is used by offer
// cards in both contexts.
function findOfferById(id) {
  const fromDashboard = state.offers.find(o => o.id === id);
  if (fromDashboard) return fromDashboard;
  // Diego's Pending Missions/Pending Milestones panels render offers that
  // live outside state.offers entirely (mirrors dashboard.html's own
  // findAnyDashOffer, same reasoning) — a plain state.offers.find() alone
  // would miss a click on either of those. Progress Monitor's own entries
  // are readOnly (no accept/dismiss button at all), so they never call
  // respond() and don't need to be searched here.
  const fromDiegoMissions = state.diegoAvailableMissions.find(o => o.id === id);
  if (fromDiegoMissions) return fromDiegoMissions;
  const fromDiegoMilestones = state.diegoAvailableMilestones.find(o => o.id === id);
  if (fromDiegoMilestones) return fromDiegoMilestones;
  for (const stageName in state.journeyData) {
    const found = (state.journeyData[stageName].offers || []).find(o => o.id === id);
    if (found) return found;
  }
  return null;
}

async function fetchOffers() {
  const customer = getCustomer();
  if (!customer) return;

  // Diego never triggers a live (or mock) container call from this app —
  // deliberately, per explicit instruction. His one-and-only container call
  // happens on the website (ensureDiegoContainerOffers, js/cdh.js), once per
  // session, at login; this app only ever adopts whatever that call already
  // cached into the shared session (adoptSharedDiegoState) and recomputes
  // his current stage's offers locally from it (loadDiegoOffersForCurrentStage).
  // If he opens this app before ever visiting the website, these panels stay
  // empty until he does.
  if (customer.id === "C1004") {
    state.expandedId = null;
    adoptSharedDiegoState(customer.id);
    state.diegoAvailableMissions = getDiegoAvailableMissions(customer);
    state.diegoAvailableMilestones = getDiegoAvailableMilestones(customer);
    state.diegoProgressMonitor = getDiegoProgressMonitor(customer);
    loadDiegoOffersForCurrentStage();
    render();
    return;
  }

  state.loading = true;
  state.expandedId = null;
  render();

  // Priya's Personalized Offers section shows only the action for whichever
  // stage of her journey she's currently on — fetched via a dedicated
  // stage-scoped request (same approach the guided journey flow already
  // uses: the mock fallback filters the catalog by stage category BEFORE
  // scoring, not a general top-N filtered after the fact, since her stage's
  // action might not even appear in a generic top-N pull to begin with).
  if (state.activeJourney?.id === "loan-card-crosssell" && !state.outage) {
    const journey = state.activeJourney;
    const stage = journey.stages[state.journeyIndex] || journey.stages[0];
    const alreadyLogged = state.log.some(e => e.type === "impression" && e.journeyId === journey.id && e.text.startsWith(`[${stage.stage}]`));
    // Robert: mobile never calls the Container API itself (explicit
    // request) — only ever copies whatever the website already fetched via
    // ensureRobertContainerOffers (js/cdh.js), same "adopt, don't fetch"
    // rule Diego already has (adoptSharedDiegoState). If he hasn't logged
    // into the website this session, state.robertContainerOffers stays
    // null and this panel shows an explicit "nothing to show yet" message
    // (state.offers.length === 0 branch further down) instead of making
    // its own live or mock call.
    adoptSharedRobertContainerOffers(customer.id);
    if (!Array.isArray(state.robertContainerOffers)) {
      state.offers = [];
      state.meta = null;
      state.journeyData[stage.stage] = { loading: false, offers: [], meta: null, error: null, source: null };
      state.loading = false;
      render();
      return;
    }
    const matched = hideAcceptedPreApprovedOffer(filterOffersForStage(state.robertContainerOffers, stage));
    state.offers = matched;
    state.meta = state.robertContainerMeta;
    state.journeyData[stage.stage] = { loading: false, offers: matched, meta: state.robertContainerMeta, error: null, source: state.robertContainerMeta?.fallback ? "mock" : "live" };
    if (!alreadyLogged) {
      matched.forEach(o => pushLog("impression", `[${stage.stage}] Impression logged Pega CDH RTC — ${o.title}`, journey.id, o.id));
    }
    state.loading = false;
    writeSharedLastFetched(state.offers.map(o => o.id), state.meta);
    render();
    augmentPreApprovedOfferWithRate();
    augmentLoanAmountTiles();
    return;
  }

  // Aria: same "adopt, don't fetch" rule as Robert above — mobile never
  // calls the Container API for her either, only copies whatever the
  // website already fetched via ensureAriaContainerOffers (js/cdh.js). If
  // she hasn't logged into the website this session, state.ariaContainerOffers
  // stays null and this panel shows an explicit "nothing to show yet"
  // message instead of making its own live or mock call.
  if (state.activeJourney?.id === "wealth-management" && !state.outage) {
    const journey = state.activeJourney;
    const stage = journey.stages[state.journeyIndex] || journey.stages[0];
    const alreadyLogged = state.log.some(e => e.type === "impression" && e.journeyId === journey.id && e.text.startsWith(`[${stage.stage}]`));
    adoptSharedAriaContainerOffers(customer.id);
    if (!Array.isArray(state.ariaContainerOffers)) {
      state.offers = [];
      state.meta = null;
      state.journeyData[stage.stage] = { loading: false, offers: [], meta: null, error: null, source: null };
      state.loading = false;
      render();
      return;
    }
    const matched = filterOffersForStage(state.ariaContainerOffers, stage);
    state.offers = matched;
    state.meta = state.ariaContainerMeta;
    state.journeyData[stage.stage] = { loading: false, offers: matched, meta: state.ariaContainerMeta, error: null, source: state.ariaContainerMeta?.fallback ? "mock" : "live" };
    if (!alreadyLogged) {
      matched.forEach(o => pushLog("impression", `[${stage.stage}] Impression logged Pega CDH RTC — ${o.title}`, journey.id, o.id));
    }
    state.loading = false;
    writeSharedLastFetched(state.offers.map(o => o.id), state.meta);
    render();
    return;
  }

  // Maya: same "adopt, don't fetch" rule as Robert/Aria above — mobile
  // never calls the Container API for her either, only copies whatever the
  // website already fetched via ensureMayaContainerOffers (js/cdh.js). If
  // she hasn't logged into the website this session, state.mayaContainerOffers
  // stays null and this panel shows an explicit "nothing to show yet"
  // message instead of making its own live or mock call.
  if (state.activeJourney?.id === "digital-activation-onboarding" && !state.outage) {
    const journey = state.activeJourney;
    const stage = journey.stages[state.journeyIndex] || journey.stages[0];
    const alreadyLogged = state.log.some(e => e.type === "impression" && e.journeyId === journey.id && e.text.startsWith(`[${stage.stage}]`));
    adoptSharedMayaContainerOffers(customer.id);
    if (!Array.isArray(state.mayaContainerOffers)) {
      state.offers = [];
      state.meta = null;
      state.journeyData[stage.stage] = { loading: false, offers: [], meta: null, error: null, source: null };
      state.loading = false;
      render();

    // and crowding out real accept/dismiss entries in the ledger.

      const result = await simulateCDHRequest(customer);

      const journeyTitles = getJourneyActionTitleSet(customer);

      }
    }
  }

  // selected — this only reorders the top 3 that will actually be shown, so
  // they follow the customer's journey stage sequence (Awareness before
  // Consideration before Conversion, etc.) instead of raw priority order.
  const topByPriority = state.offers.slice(0, 3);
  const rest = state.offers.slice(3);

  state.loading = false;
  writeSharedLastFetched(state.offers.map(o => o.id), state.meta);
  render();
}

  state.mariaContainerOffers = null;
  state.mariaContainerMeta = null;
  state.angelicaContainerOffers = null;
  state.angelicaContainerMeta = null;
  adoptSharedCurrentStage(id);
  adoptSharedLedgerData(id);
  // Loan journey customers always start fresh at the Prospect stage on
  // login — matching the website's login behavior exactly — rather than
  // adopting wherever they may have previously left off.
  if (isLoanCardJourneyCustomer(id)) {
    state.activeJourney = getJourneyById("loan-card-crosssell");
    state.journeyIndex = 0;
    writeSharedCurrentStage(id, "loan-card-crosssell", 0);
  }
  // Diego doesn't reset to a fixed starting stage the way Priya does — he
  // adopts wherever the website last left him (adoptSharedCurrentStage
  // above, generic and already Diego-aware once his journey was registered
  // in JOURNEYS). Only defaults to a fresh Discover-stage start if nothing
  // was adopted at all — e.g. he's opening this app before ever visiting
  // the website.
  if (id === "C1004" && (!state.activeJourney || state.activeJourney.id !== "priority-banking-upgrade")) {
    state.activeJourney = getJourneyById("priority-banking-upgrade");
    state.journeyIndex = 0;
  }
  // Aria, same reasoning as Diego above — lands directly on the Awareness
  // stage of her Wealth Management & Advisory journey even if she opens
  // this app before ever visiting the website (so adoptSharedCurrentStage
  // above had nothing to adopt). Matches login.html's website behavior,
  // which puts her straight on this journey's Awareness stage too.
  if (id === "CUST101" && (!state.activeJourney || state.activeJourney.id !== "wealth-management")) {
    state.activeJourney = getJourneyById("wealth-management");
    state.journeyIndex = 0;

  // Awareness stage of her Digital Activation & Onboarding journey even if
  // she opens this app before ever visiting the website. Matches
  // login.html's website behavior, which puts her straight on this
  // journey's Awareness stage too. getJourneyById always finds this journey
  // by id regardless of the MAYA_ACTIVE_JOURNEY_ID toggle (its
  // eligibleCustomerId just goes null when the toggle points elsewhere),
  // so eligibility is checked explicitly via journeyMatchesCustomer rather
  // than mere truthiness — otherwise this would wrongly force her onto this
  // journey even while the toggle has her on loan-card-crosssell instead
  // (isLoanCardJourneyCustomer's block above already handles that case).

  state.mobileMessagesOnly = false;

// Auto-advances Priya's Personal Loan & Card Cross-Sell journey to the next
// stage whenever she accepts the offer for whichever stage she's currently
// on — scoped specifically to this one journey/customer, and only from the
// Dashboard-level Personalized Offers experience (not the guided journey
// flow itself, which keeps its own Next/stepper/transition-screen mechanism
// as the primary way to move between stages there). Writes the new position
// to shared storage too, so an open website tab picks it up live.
function maybeAdvanceJourneyStage(offer, status) {
  if (state.view !== "dashboard") return false;
  if (state.activeJourney?.id === "priority-banking-upgrade") {
    return maybeAdvanceDiegoStage(offer, status);
  }
  if (status !== "accepted") return false;
  if (state.activeJourney?.id !== "loan-card-crosssell") return false;
  const stageIndex = state.journeyIndex;
  const stage = state.activeJourney.stages[stageIndex];
  if (!stage) return false;
  // Prospect is a special case — it has multiple actions (Pre-Approved
  // Loan Offer, Lifestyle Card Recommendation, In-Session Loan Calculator),
  // but only In-Session Loan Calculator's Apply Now flow should actually
  // advance her out of it. Every other stage keeps the generic "any
  // matching action advances" behavior.
  const isCurrentStageOffer = stage.stage === "Prospect"
    ? normalizeActionTitle(offer.title) === normalizeActionTitle("In-Session Loan Calculator")
    : stage.actions.some(a => normalizeActionTitle(a) === normalizeActionTitle(offer.title));
  if (!isCurrentStageOffer) return false;
  if (stageIndex >= state.activeJourney.stages.length - 1) return false;
  state.journeyIndex = stageIndex + 1;
  writeSharedCurrentStage(state.customerId, state.activeJourney.id, state.journeyIndex);
  if (state.customerId === PRIYA_CUSTOMER_ID) {
    const instJourney = INST_JOURNEY_STAGE_NAMES[state.journeyIndex];
    if (instJourney) sendMessageStatus(state.customerId, instJourney);
    // Temporarily moved to Consideration instead of Deepening — see
    // sendDeepeningStageEmail() call below. Left here commented out (not
    // deleted) so this is easy to revert once this is no longer "for now".
    // if (state.activeJourney.stages[state.journeyIndex].stage === "Deepening") {
    //   sendDeepeningStageEmail();
    // }
    if (state.activeJourney.stages[state.journeyIndex].stage === "Consideration") {
      sendDeepeningStageEmail();
    }
  }
  return true;
}

// Reuses the same Brevo Events API call already wired up for Sam's Brevo
// Automation card (triggerBrevoDecisionEvent above) — rather than calling
// the Transactional Email API directly, this fires the same
// "pega_nba_decision" event Sam's flow uses. Whether an actual email goes
// out from this depends on a Brevo Automation workflow configured on the
// account side to react to that event, the same dependency Sam's flow
// already has.
async function sendDeepeningStageEmail() {
  const customer = getCustomer();
  if (!customer?.email) return;
  const result = await triggerBrevoDecisionEvent(customer);
  if (result.status === "ok") {
    pushLog("system", `Brevo event sent for ${customer.name} — "pega_nba_decision" (Consideration stage reached)`, state.activeJourney?.id || null);
  } else {
    pushLog("system", `Brevo event failed: ${result.error}`, state.activeJourney?.id || null);
    console.error("Brevo event failed:", result.error);
  }
  if (state.view === "dashboard" || state.view === "journey") render();
}

function respond(offerId, status) {
  const offer = findOfferById(offerId);
  if (!offer) return;
  const customer = getCustomer();
  const isDiego = customer?.id === "C1004";
  // Captured BEFORE journeyActionResponses changes below — mirrors
  // dashboard.html's handleRespond, which reads this at the very top for
  // the same reason: registering a mission via Pending Missions needs to
  // trigger the late-registration merges further down, and that only
  // makes sense checked against state as it was right before this response.
  const wasAvailableMission = isDiego && state.diegoAvailableMissions.some(o => o.id === offerId);
  state.responses[offerId] = status;
  if (isDiego) {
    state.journeyActionResponses[normalizeActionTitle(offer.title)] = status;
  }
  const journeyId = state.activeJourney ? state.activeJourney.id : null;
  pushLog(
    status,
    status === "accepted"
      ? `${offer.title} accepted — response sent to Interaction History`
      : `${offer.title} dismissed — response sent to Interaction History`,
    journeyId,
    offerId
  );
  if (customer) {
    // Loan Disbursement Confirmation means the customer's loan actually
    // disbursed — reflect that in their profile so subsequent Decision
    // Receipts show it. Matched by title, not id, for the same reason
    // established earlier: live CDH assigns ids from Pega's own Name
    // field, not our catalog id.
    if (status === "accepted" && isLoanCardJourneyCustomer(customer.id) && normalizeActionTitle(offer.title) === normalizeActionTitle("Loan Disbursement Confirmation")) {
      customer.numLoanAccounts = 1;
      writeSharedLoanDisbursed(customer.id);
    }
    // Find whichever context actually served this offer — the dashboard rail
    // or the current journey stage — so the capture_response call reflects
    // the real channel/direction/subjectId used. Prioritized by the actual
    // current view rather than just "does state.offers contain this id",
    // since the same offer can legitimately appear in both places at once
    // (e.g. eligible for both the dashboard rail and a journey stage) — using
    // whichever the customer is actually looking at avoids misattributing a
    // journey-stage click's context to the dashboard's, or vice versa.
    let sourceMeta = null;
    if (state.view === "journey" && state.activeJourney) {
      const currentStage = state.activeJourney.stages[state.journeyIndex];
      const stageData = currentStage ? state.journeyData[currentStage.stage] : null;
      if (stageData && (stageData.offers || []).some(o => o.id === offerId)) {
        sourceMeta = stageData.meta;
      }
    }
    if (!sourceMeta && state.offers.some(o => o.id === offerId)) {
      sourceMeta = state.meta;
    }
    if (!sourceMeta) {
      for (const stageName in state.journeyData) {
        const stageData = state.journeyData[stageName];
        if ((stageData.offers || []).some(o => o.id === offerId)) {
          sourceMeta = stageData.meta;
          break;
        }
      }
    }
    sendCaptureResponse(customer, offer, {
      channel: sourceMeta?.channel || "Mobile",
      direction: sourceMeta?.direction || CDH_DIRECTION,
      subjectId: sourceMeta?.subjectId || customer.id,
      outcome: status === "accepted" ? "Accepted" : "Dismiss",
      behavior: status === "accepted" ? "Positive" : "Negative",
    });
  }
  syncLedgerToSharedSession();

  // Everything below this point is Diego's own campaign logic — ported from
  // dashboard.html's handleRespond (see that function's own comments for
  // the full reasoning behind each merge; kept as close to word-for-word
  // as this file's different state shape allows). Branches away entirely
  // and returns before reaching Priya's Thanks-screen/EMI-calculator logic
  // below, none of which applies to him.
  if (isDiego) {
    syncDiegoJarToSharedSession();
    notifyDiegoMissionCompletedIfNewlyEligible(customer);
    // Scratching a card reveals its prize right there, in that same card,
    // instead of surfacing a separate "500 Points Earned"-style offer
    // elsewhere in Personalized Offers. The paired reward is still recorded
    // for real (own capture_response + ledger entry), just never gets a
    // visible card of its own.
    let scratchReveal = null;
    if (status === "accepted") {
      const rewardTitle = DIEGO_SCRATCH_REWARD_TITLE[normalizeActionTitle(offer.title)];
      if (rewardTitle) {
        const rewardOffer = getDiegoContainerOfferByTitle(rewardTitle);
        if (rewardOffer && state.journeyActionResponses[normalizeActionTitle(rewardTitle)] === undefined) {
          state.responses[rewardOffer.id] = "accepted";
          state.journeyActionResponses[normalizeActionTitle(rewardOffer.title)] = "accepted";
          pushLog("accepted", `${rewardOffer.title} accepted — response sent to Interaction History`, journeyId, rewardOffer.id);
          sendCaptureResponse(customer, rewardOffer, {
            channel: "Mobile",
            direction: CDH_DIRECTION,
            subjectId: customer.id,
            outcome: "Accepted",
            behavior: "Positive",
          });
        }
        scratchReveal = getDiegoScratchRevealDescription(offer.title);
      }
    }
    // Registering for a mission via Pending Missions specifically means its
    // Engage action(s) may carry a stale "dismissed" auto-resolve from an
    // earlier Engage-stage view that happened while this mission was still
    // unregistered — clear that before recomputing anything below.
    if (wasAvailableMission && status === "accepted") {
      clearStaleMissionEngageResolve(offer.title);
    }
    // A mission can also complete late this same way one stage further
    // along — e.g. accepting the last Engage action via Pending Milestones,
    // after Earn stage already auto-resolved that mission's "Mission
    // Completed" to "dismissed" while it was still incomplete.
    clearStaleMissionCompletedResolve();
    state.diegoAvailableMissions = getDiegoAvailableMissions(customer);
    state.diegoAvailableMilestones = getDiegoAvailableMilestones(customer);
    state.diegoProgressMonitor = getDiegoProgressMonitor(customer);
    let offersChanged = false;
    // He may have already advanced past Engage by registering for the
    // OTHER mission first — Personalized Offers' own stage-scoped fetch
    // would then never pick up this mission's Engage action(s) on its own.
    if (wasAvailableMission && status === "accepted") {
      getDiegoEngageOffersForMission(offer.title, customer).forEach(u => {
        if (!state.offers.some(existing => normalizeActionTitle(existing.title) === normalizeActionTitle(u.title))) {
          state.offers.push(u);
          offersChanged = true;
        }
      });
    }
    // Same idea for a Mission Completed card that just became eligible.
    getDiegoNewlyCompletedMissionOffers(customer).forEach(u => {
      if (!state.offers.some(existing => normalizeActionTitle(existing.title) === normalizeActionTitle(u.title))) {
        state.offers.push(u);
        offersChanged = true;
      }
    });
    // Same idea one stage further along still — a scratch card can become
    // newly eligible from a response that never touches Scratch & Win's
    // own fetch, e.g. accepting a Mission Completed card merged in above.
    getDiegoUnlockedScratchOffers(customer).forEach(u => {
      if (!state.offers.some(existing => normalizeActionTitle(existing.title) === normalizeActionTitle(u.title))) {
        state.offers.push(u);
        offersChanged = true;
      }
    });
    state.offers = sortDiegoScratchCards(state.offers);
    if (offersChanged) writeSharedLastFetched(state.offers.map(o => o.id), state.meta);

    if (maybeAdvanceJourneyStage(offer, status)) {
      // Stage advanced — recompute from the cached container response for
      // wherever he landed, rather than losing everything the merges above
      // just did.
      loadDiegoOffersForCurrentStage();
      let reMerged = false;
      getDiegoNewlyCompletedMissionOffers(customer).forEach(u => {
        if (!state.offers.some(existing => normalizeActionTitle(existing.title) === normalizeActionTitle(u.title))) {
          state.offers.push(u);
          reMerged = true;
        }
      });
      // Card 3 specifically is excluded here — its own CTA is "Fulfillment
      // Info", and clicking it is meant to cleanly hand him off to Fulfil's
      // own two offers rather than leaving a scratched card lingering next
      // to them, unlike Card 1/2's reveal-in-place behavior below.
      if (scratchReveal && normalizeActionTitle(offer.title) !== normalizeActionTitle("Your Third Scratch Card, Looks Like You're a Pro")) {
        state.offers.push({ ...offer, description: scratchReveal });
        reMerged = true;
      }
      if (reMerged) {
        state.offers = sortDiegoScratchCards(state.offers);
        writeSharedLastFetched(state.offers.map(o => o.id), state.meta);
      }
    } else if (scratchReveal) {
      // Stage didn't change — keep the card itself in place and swap its
      // description for the reveal text, so the prize shows right there.
      const idx = state.offers.findIndex(o => o.id === offerId);
      if (idx !== -1) state.offers[idx] = { ...state.offers[idx], description: scratchReveal };
    } else if (DIEGO_FULFIL_TITLES.includes(normalizeActionTitle(offer.title))) {
      // Fulfil-stage offers stay visible after a response instead of being
      // removed — it's the last stage of his journey, so there's nothing
      // further to make room for.
    } else {
      state.offers = state.offers.filter(o => o.id !== offerId);
    }
    // Auto-opens the tab that now holds whatever he just unlocked, instead
    // of leaving him on whichever screen he happened to tap from. Playing
    // the Discover-stage game surfaces his two missions; registering for a
    // mission (only reachable from Pending Missions to begin with) surfaces
    // the milestones it just unlocked.
    if (status === "accepted" && normalizeActionTitle(offer.title) === normalizeActionTitle("Register to Win Exciting Gifts")) {
      state.diegoTab = "missions";
    } else if (wasAvailableMission && status === "accepted") {
      state.diegoTab = "milestones";
    }
    render();
    return;
  }

  // Priya, accepting Pre-Approved Loan Offer or Loan Top-Up / Refinance:
  // show a brief "Thanks for your interest" screen before returning to the
  // dashboard — shown AFTER the existing accept/stage-advance logic above
  // has already run, so nothing about that flow changes; this only adds an
  // interstitial screen on top of it.
  const showThanksAfter = !!(
    customer &&
    isLoanCardJourneyCustomer(customer.id) &&
    status === "accepted" &&
    (normalizeActionTitle(offer.title) === normalizeActionTitle("Pre-Approved Loan Offer") ||
      normalizeActionTitle(offer.title) === normalizeActionTitle("Loan Top-Up / Refinance"))
  );
  // In-Session Loan Calculator: instead of the Thanks screen, opens a
  // dedicated EMI calculator pre-filled from Pre-Approved Loan Offer's
  // terms, shown AFTER the accept/stage-advance logic above has already
  // run — same non-invasive pattern as the Thanks screen.
  const showEmiCalculatorAfter = status === "accepted" && normalizeActionTitle(offer.title) === normalizeActionTitle("In-Session Loan Calculator");
  if (maybeAdvanceJourneyStage(offer, status)) {
    const fetchPromise = fetchOffers(); // stage advanced — re-fetch so the panel shows the new stage's action, renders internally
    if (showThanksAfter) fetchPromise.then(showThanksForBankingProducts);
    if (showEmiCalculatorAfter) fetchPromise.then(showEmiCalculator);
  } else {
    render();
    if (showThanksAfter) showThanksForBankingProducts();
    if (showEmiCalculatorAfter) showEmiCalculator();
  }
}

// Shows the OfferedRate directly on the Pre-Approved Loan Offer tile
// itself (Prospect stage), not just on the EMI Calculator screen. Used to
// require its own separate fetch to a dedicated lending CDH instance
// (fetchPriyaInterestRate against cdhfslending.pegademo.com) — Pega now
// returns OfferedRate directly on the offer from the main container call
// (mapPegaOffer above), so this is synchronous: no network call. Also
// stashes the rate onto state.lastOfferedRate so the EMI Calculator / New
// Application flows (reached later in the same session) can read it
// without a call of their own, the same way state.lastLoanTerms already
// carries the loan amount across those same flows.
function augmentPreApprovedOfferWithRate() {
  const offer = state.offers.find(o => normalizeActionTitle(o.title) === normalizeActionTitle("Pre-Approved Loan Offer"));
  if (!offer || offer.offeredRate == null) return;
  offer.description = `You're pre-approved for a personal loan up to $12,000 at ${offer.offeredRate}% p.a. — no paperwork needed to check your rate.`;
  state.lastOfferedRate = offer.offeredRate;

}

// Both Personal Loan Offer and Loan Disbursement Confirmation have a fixed
// dollar amount baked directly into their SVG at catalog-definition time.
// If she's already visited the EMI Calculator (via In-Session Loan
// Calculator), swap each static amount for whatever loan amount she
// actually set there — otherwise leave each default in place, since
// there's nothing else to base it on.
const LOAN_AMOUNT_TILES = [
  { title: "Personal Loan Offer", staticAmount: "$15,000" },
  { title: "Loan Disbursement Confirmation", staticAmount: "$12,000" },
];

function augmentLoanAmountTiles() {
  if (!state.lastLoanTerms) return;
  let changed = false;
  for (const { title, staticAmount } of LOAN_AMOUNT_TILES) {
    const offer = state.offers.find(o => normalizeActionTitle(o.title) === normalizeActionTitle(title));
    if (!offer || offer.__amountApplied) continue;
    // image is a URL-encoded SVG data URI (see svgDataUri()), so the
    // static amount never appears literally in the string — has to be
    // decoded first, edited, then re-encoded the same way it was
    // originally built.
    const prefix = "data:image/svg+xml;utf8,";
    if (!offer.image?.startsWith(prefix)) continue;
    const decodedSvg = decodeURIComponent(offer.image.slice(prefix.length));
    if (!decodedSvg.includes(staticAmount)) continue;
    const formattedAmount = `$${state.lastLoanTerms.loanAmount.toLocaleString()}`;
    offer.image = prefix + encodeURIComponent(decodedSvg.replace(staticAmount, formattedAmount));
    offer.__amountApplied = true;
    changed = true;
  }
  // The main render() for this fetch already ran synchronously just before
  // this call, so without re-rendering here the DOM would keep showing the
  // stale illustration until some unrelated re-render happened to fire
  // later.
  if (changed && (state.view === "dashboard" || state.view === "journey")) render();
}

function handleEmiCalculatorField(field, value) {
  const num = parseFloat(value);
  state.emiCalculator[field] = isNaN(num) ? 0 : num;
  // Only the result box updates in place — re-rendering the whole screen
  // on every keystroke (via render()) would destroy and recreate the input
  // elements, losing focus and cursor position mid-type.
  const box = document.getElementById("emiResultBox");
  if (box) box.innerHTML = renderEmiResult();
}

function handleEmiCalculatorExit() {
  // Kept around so the New Application wizard's Additional Info step can
  // carry these over, if she later applies via Personal Loan Offer's Apply
  // Now — a separate flow that doesn't otherwise touch this screen at all.
  state.lastLoanTerms = { ...state.emiCalculator };
  state.view = "dashboard";
  state.mobileOffersOnly = false;
  state.mobileMessagesOnly = false;
  document.querySelectorAll(".bnk-tab-item").forEach(b => b.classList.remove("current"));
  const homeTabBtn = document.querySelector('[data-tab-id="home"]');
  if (homeTabBtn) homeTabBtn.classList.add("current");
  // fetchOffers() (where this normally runs) already completed earlier,
  // before lastLoanTerms existed — re-applying it here, now that it does,
  // rather than waiting on some future unrelated re-fetch to pick it up.
  augmentLoanAmountTiles();
  render();
}

function calculateEmi(principal, annualRatePercent, tenureMonths) {
  if (!principal || !tenureMonths) return 0;
  const monthlyRate = annualRatePercent / 12 / 100;
  if (monthlyRate === 0) return principal / tenureMonths;
  const factor = Math.pow(1 + monthlyRate, tenureMonths);
  return (principal * monthlyRate * factor) / (factor - 1);
}

function renderEmiResult() {
  const { loanAmount, interestRate, tenureMonths } = state.emiCalculator;
  const emi = calculateEmi(loanAmount, interestRate, tenureMonths);
  const totalPayment = emi * tenureMonths;
  const totalInterest = totalPayment - loanAmount;
  return `
    <div style="font-size:0.8rem;color:var(--ink-soft);margin-bottom:0.2rem;">Estimated Monthly Payment</div>
    <div class="bnk-display" style="font-size:2rem;color:var(--brass);">$${emi.toFixed(2)}/mo</div>
    <div style="display:flex; gap:1.5rem; margin-top:0.8rem; font-size:0.8rem; color:var(--ink-soft); flex-wrap:wrap;">
      <div>Total Interest: <strong style="color:var(--ink);">$${totalInterest.toFixed(2)}</strong></div>
      <div>Total Payment: <strong style="color:var(--ink);">$${totalPayment.toFixed(2)}</strong></div>
    </div>`;
}

/* ------------------------------------------------------------------ */
/* New Application: a standalone form wizard (Sam Okafor only) — plain   */
/* mock data entry, not tied to CDH decisioning. Three stages: Basic     */
/* Info, Additional Info (Exit / Finalize), and a Confirmation screen.   */
/* ------------------------------------------------------------------ */

// Segment Analytics — same snippet that's commented out in <head>, just
// wrapped in a function instead of auto-running on page load. Only called
// from exitApplication()/finalizeApplication() below, so it only actually
// fires once the customer reaches the Abandoned Application or Confirmation
// stage — every other screen never loads it.
//
// IMPORTANT: segmentEnabled only guards the one-time script load below — it
// must NOT gate the identify() call. This is a single-file SPA, so switching
// customers (sign out, pick someone else) never reloads the page; if the
// whole function short-circuited after the first customer, every later
// customer's session would silently keep reporting the FIRST customer's
// identity to Segment, since identify() would simply never run again.
//
// ORDERING: Segment's own vendor snippet normally calls analytics.page() as
// its very last line, which would fire before we ever get a chance to call
