<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Instellars — Investment Account Application</title>
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
<div id="app" class="bnk-root"></div>

<script src="js/data.js"></script>
<script src="js/cdh.js"></script>
<script src="js/session.js"></script>
<script src="js/behavioral.js"></script>
<script src="js/render-shared.js"></script>
<script>
  const customer = requireLoggedInCustomer();

  if (customer) {
    const session = loadSession();
    // Reached only via "Open a New Investment Account"'s Apply Now (see
    // handleApplyInvestmentAccount in dashboard.html / journey.html), which
    // always calls resetInvestmentApplication() first — a direct visit
    // without that happening has nothing to show, so send it back rather
    // than rendering on undefined data. Same pattern as sip-application.html
    // (Aria), a separate wizard since the two collect different fields.
    if (!session.investmentApplication) {
      window.location.href = "dashboard.html";
    } else {
      const params = new URLSearchParams(window.location.search);
      const stage = Math.max(0, Math.min(2, parseInt(params.get("stage"), 10) || 0));

      // Segment Analytics — same snippet commented out in <head>, wrapped in
      // a function instead of auto-running on page load. Only called below
      // when stage === 2 (Abandoned Setup / Confirmation). Mirrors
      // sip-application.html's own enableSegmentAnalytics() exactly.
      function enableSegmentAnalytics() {
        if (!window.analytics) {
          !function(){var i="analytics",analytics=window[i]=window[i]||[];if(!analytics.initialize)if(analytics.invoked)window.console&&console.error&&console.error("Segment snippet included twice.");else{analytics.invoked=!0;analytics.methods=["trackSubmit","trackClick","trackLink","trackForm","pageview","identify","reset","group","track","ready","alias","debug","page","screen","once","off","on","addSourceMiddleware","addIntegrationMiddleware","setAnonymousId","addDestinationMiddleware","register"];analytics.factory=function(e){return function(){if(window[i].initialized)return window[i][e].apply(window[i],arguments);var n=Array.prototype.slice.call(arguments);if(["track","screen","alias","group","page","identify"].indexOf(e)>-1){var c=document.querySelector("link[rel='canonical']");n.push({__t:"bpc",c:c&&c.getAttribute("href")||void 0,p:location.pathname,u:location.href,s:location.search,t:document.title,r:document.referrer})}n.unshift(e);analytics.push(n);return analytics}};for(var n=0;n<analytics.methods.length;n++){var key=analytics.methods[n];analytics[key]=analytics.factory(key)}analytics.load=function(key,n){var t=document.createElement("script");t.type="text/javascript";t.async=!0;t.setAttribute("data-global-segment-analytics-key",i);t.src="https://cdn.segment.com/analytics.js/v1/" + key + "/analytics.min.js";var r=document.getElementsByTagName("script")[0];r.parentNode.insertBefore(t,r);analytics._loadOptions=n};analytics._writeKey="rXdBVA5oE27vBDqifUzSmXs2K3pHoD8R";;analytics.SNIPPET_VERSION="5.2.0";   analytics.load("rXdBVA5oE27vBDqifUzSmXs2K3pHoD8R");   }}();
        }
        window.analytics.identify(customer.id, {
          name: customer.name,
          segment: customer.segment,
          tenureYears: customer.tenureYears,
        });
        window.analytics.page();
      }
      if (stage === 2) {
        if (session.investmentApplication.completed === false) {
          document.title = "Abandoned Setup";
        } else if (session.investmentApplication.completed === true) {
          document.title = "Investment Account Opened";
        }
        enableSegmentAnalytics();
      }

      function stageHref(i) {
        return `investment-application.html?stage=${i}`;
      }

      function renderBody() {
        const d = session.investmentApplication.data;
        const finalStageLabel = session.investmentApplication.completed === false ? "Abandoned Setup" : "Confirmation";

        const stepperHtml = ["Basic Info", "Account Details", finalStageLabel].map((label, i) => {
          const status = i === stage ? "current" : i < stage ? "done" : "upcoming";
          const dotContent = i < stage ? icon("check", 12) : String(i + 1);
          const connector = i < 2 ? `<div class="bnk-stepper-line ${i < stage ? "done" : ""}"></div>` : "";
          return `
            <div class="bnk-stepper-item">
              <span class="bnk-stepper-dot bnk-stepper-${status}">${dotContent}</span>
              <span class="bnk-stepper-label">${label}</span>
            </div>${connector}`;
        }).join("");

        let bodyHtml;
        if (stage === 0) {
          bodyHtml = `
            <div class="bnk-application-panel">
              <div class="bnk-display" style="font-size:1.2rem;margin-bottom:1.2rem;">Basic Info</div>
              <div class="bnk-form-row">
                <div class="bnk-form-group">
                  <label class="bnk-form-label">Full name</label>
                  <input class="bnk-form-input" type="text" placeholder="Jane Doe" value="${d.fullName || ""}" oninput="handleFieldChange('fullName', this.value)" />
                </div>
                <div class="bnk-form-group">
                  <label class="bnk-form-label">Age</label>
                  <input class="bnk-form-input" type="number" placeholder="34" value="${d.age ?? ""}" oninput="handleFieldChange('age', this.value)" />
                </div>
              </div>
              <div class="bnk-form-row">
                <div class="bnk-form-group">
                  <label class="bnk-form-label">Email address</label>
                  <input class="bnk-form-input" type="email" placeholder="jane@example.com" value="${d.email || ""}" oninput="handleFieldChange('email', this.value)" />
                </div>
                <div class="bnk-form-group">
                  <label class="bnk-form-label">Phone number</label>
                  <input class="bnk-form-input" type="tel" placeholder="(555) 555-0100" value="${d.phone || ""}" oninput="handleFieldChange('phone', this.value)" />
                </div>
              </div>
              <div class="bnk-application-actions">
                <span></span>
                <a class="bnk-btn-primary" style="flex:none;padding:0.6rem 1.4rem;text-decoration:none;" href="${stageHref(1)}">Continue ${icon("chevronRight", 14)}</a>
              </div>
            </div>`;
        } else if (stage === 1) {
          bodyHtml = `
            <div class="bnk-application-panel">
              <div class="bnk-display" style="font-size:1.2rem;margin-bottom:1.2rem;">Account Details</div>
              <div class="bnk-form-group">
                <label class="bnk-form-label">Mailing address</label>
                <input class="bnk-form-input" type="text" placeholder="123 Main St, Springfield" value="${d.address || ""}" oninput="handleFieldChange('address', this.value)" />
              </div>
              <div class="bnk-form-row">
                <div class="bnk-form-group">
                  <label class="bnk-form-label">Employment status</label>
                  <select class="bnk-form-select" onchange="handleFieldChange('employment', this.value)">
                    <option value="">Select one</option>
                    <option value="Employed" ${d.employment === "Employed" ? "selected" : ""}>Employed</option>
                    <option value="Self-employed" ${d.employment === "Self-employed" ? "selected" : ""}>Self-employed</option>
                    <option value="Student" ${d.employment === "Student" ? "selected" : ""}>Student</option>
                    <option value="Retired" ${d.employment === "Retired" ? "selected" : ""}>Retired</option>
                  </select>
                </div>
                <div class="bnk-form-group">
                  <label class="bnk-form-label">Annual income</label>
                  <input class="bnk-form-input" type="text" placeholder="$50,000" value="${d.income || ""}" oninput="handleFieldChange('income', this.value)" />
                </div>
              </div>
              <div class="bnk-form-row">
                <div class="bnk-form-group">
                  <label class="bnk-form-label">Initial deposit amount</label>
                  <input class="bnk-form-input" type="text" placeholder="$1,000" value="${d.initialDeposit || ""}" oninput="handleFieldChange('initialDeposit', this.value)" />
                </div>
                <div class="bnk-form-group">
                  <label class="bnk-form-label">Investment horizon</label>
                  <input class="bnk-form-input" type="text" placeholder="5 years" value="${d.investmentHorizon || ""}" oninput="handleFieldChange('investmentHorizon', this.value)" />
                </div>
              </div>
              <div class="bnk-form-group">
                <label class="bnk-form-label">Account type</label>
                <select class="bnk-form-select" onchange="handleFieldChange('accountType', this.value)">
                  <option value="">Select one</option>
                  <option value="Mutual Fund Portfolio" ${d.accountType === "Mutual Fund Portfolio" ? "selected" : ""}>Mutual Fund Portfolio</option>
                  <option value="Direct Equity Account" ${d.accountType === "Direct Equity Account" ? "selected" : ""}>Direct Equity Account</option>
                  <option value="Fixed Income Fund" ${d.accountType === "Fixed Income Fund" ? "selected" : ""}>Fixed Income Fund</option>
                  <option value="Balanced Advantage Fund" ${d.accountType === "Balanced Advantage Fund" ? "selected" : ""}>Balanced Advantage Fund</option>
                </select>
              </div>
              <div class="bnk-application-actions">
                <button class="bnk-btn-ghost" onclick="handleExit()">Exit</button>
                <button class="bnk-btn-primary" style="flex:none;padding:0.6rem 1.4rem;" onclick="handleFinalize()">${icon("check", 14)} Finalize</button>
              </div>
            </div>`;
        } else {
          const completed = session.investmentApplication.completed === true;
          bodyHtml = `
            <div class="bnk-application-panel">
              <div class="bnk-confirmation-wrap">
                <div class="bnk-confirmation-icon ${completed ? "success" : "muted"}">${completed ? icon("check", 28) : icon("x", 28)}</div>
                <div class="bnk-display bnk-confirmation-title">${completed ? "Investment Account Opened" : "Abandoned Setup"}</div>
                <div class="bnk-confirmation-sub">
                  ${completed
                    ? `Thanks, ${d.fullName || "there"} — your new investment account has been opened and your initial deposit is on its way.`
                    : "The setup was exited before all steps were finished. No investment account was opened."}
                </div>
                <div style="display:flex; gap:0.6rem; justify-content:center; flex-wrap:wrap;">
                  ${!completed ? `<button class="bnk-btn-ghost" onclick="handleStartOver()">${icon("refreshCw", 14)} Start over</button>` : ""}
                  <a class="bnk-btn-primary" style="flex:none;padding:0.6rem 1.4rem;text-decoration:none;" href="dashboard.html">Back to dashboard</a>
                </div>
              </div>
            </div>`;
        }

        return `
          <div>
            <div class="bnk-header">
              <div class="bnk-brand" style="margin-bottom:0;">${icon("landmark", 20)}<span class="bnk-brand-word">Instellars</span></div>
              <div class="bnk-header-right">
                <span style="font-size:0.85rem;">Investment Account Application · ${customer.name}</span>
                <a class="bnk-signout-btn" style="text-decoration:none;" href="dashboard.html">${icon("x", 14)}<span> Exit to dashboard</span></a>
              </div>
            </div>
            <div class="bnk-body">
              <div class="bnk-stepper-row" style="justify-content:center;">${stepperHtml}</div>
              ${bodyHtml}
            </div>
          </div>`;
      }

      function paint() {
        document.getElementById("app").innerHTML = renderBody();
      }

      window.handleFieldChange = function (field, value) {
        session.investmentApplication.data[field] = value;
        saveSession(session);
      };
      window.handleExit = async function () {
        session.investmentApplication.completed = false;
        pushSessionLog(session, "system", "Investment account setup exited before completion.");
        // No respondToOffer call here — the offer stays unresponded (not
        // accepted, not dismissed) so it can still be shown and retried
        // later, and Diego's journey stage does not advance just because he
        // started but didn't finish. Same reasoning as sip-application.html.
        saveSession(session);
        const customer = getCustomerFromSession(session);
        if (customer) {
          const result = await triggerBrevoDecisionEvent(customer, "pega_nba_decision_investment");
          if (result.status === "ok") {
            pushSessionLog(session, "system", `Brevo event sent for ${customer.name} — "pega_nba_decision_investment" (investment account setup abandoned)`);
          } else {
            pushSessionLog(session, "system", `Brevo event failed: ${result.error}`);
            console.error("Brevo event failed:", result.error);
          }
          saveSession(session);
        }
        window.location.href = stageHref(2);
      };
      window.handleFinalize = async function () {
        session.investmentApplication.completed = true;
        // The real response — and any journey-stage advancement it
        // triggers — happens here, only now that the setup is genuinely
        // complete, not back when Apply Now was first clicked.
        if (session.pendingInvestmentOffer) {
          await respondToOffer(session, session.pendingInvestmentOffer.offer, "accepted", {
            journeyId: session.pendingInvestmentOffer.journeyId,
            meta: session.pendingInvestmentOffer.meta,
          });
          delete session.pendingInvestmentOffer;
        }
        pushSessionLog(session, "accepted", "Investment account application submitted — Investment Account Opened.");
        saveSession(session);
        window.location.href = stageHref(2);
      };
      window.handleStartOver = function () {
        resetInvestmentApplication(session);
        window.location.href = stageHref(0);
      };

      paint();
    }
  }
</script>
</body>
</html>
