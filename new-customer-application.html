<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Instellars — Open a New Account or Loan</title>
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
<div id="app" class="bnk-root"></div>

<script src="js/data.js"></script>
<script src="js/cdh.js"></script>
<script src="js/session.js"></script>
<script src="js/behavioral.js"></script>
<script>
  // This flow is for visitors who AREN'T Instellars customers yet — no
  // login, no existing customer record, no shared session the way
  // new-application.html has for Robert. State lives in sessionStorage
  // (tab-scoped, not shared with the logged-in-customer session key) so
  // navigating between stages doesn't lose what's been entered, but
  // opening a fresh tab starts a brand-new application, same as walking
  // up to a real "open an account" desk with no prior history.
  const PROSPECT_APPLICATION_KEY = "instellars_prospect_application_v1";

  function loadProspectApplication() {
    try {
      const raw = sessionStorage.getItem(PROSPECT_APPLICATION_KEY);
      if (raw) return JSON.parse(raw);
    } catch (err) {
      // Corrupt or inaccessible sessionStorage — fall through to a fresh start.
    }
    return { product: null, data: {}, completed: null };
  }
  function saveProspectApplication(app) {
    try {
      sessionStorage.setItem(PROSPECT_APPLICATION_KEY, JSON.stringify(app));
    } catch (err) {
      // Ignore — worst case, a reload loses in-progress data, same as any
      // other unsaved web form.
    }
  }

  const app = loadProspectApplication();
  const params = new URLSearchParams(window.location.search);
  const stage = Math.max(0, Math.min(2, parseInt(params.get("stage"), 10) || 0));
  // ?product=loan / ?product=account preselects the product on first visit
  // (from browse.html's two CTAs) — doesn't override a choice already made
  // on Basic Info once the applicant is further into the flow.
  if (!app.product && params.get("product") === "loan") app.product = "Personal Loan";
  if (!app.product && params.get("product") === "account") app.product = "New Deposit Account";

  function stageHref(i) {
    return `new-customer-application.html?stage=${i}`;
  }

  // Confirmation page (stage 2) is where the Tealium call fires, and it's
  // also the page with "Back to browse.html" / "Start over" links right
  // next to it — same race this app already fixed once for
  // new-application.html (see that file's own comment for the full
  // reasoning): clicking away immediately can abort the still-in-flight
  // utag.js fetch before it ever reaches Tealium. Same guarded-navigation
  // fix, ported over rather than re-derived.
  let tealiumNavGuardResolve = null;
  const tealiumNavGuard = new Promise((resolve) => { tealiumNavGuardResolve = resolve; });
  function releaseTealiumNavGuard() {
    if (tealiumNavGuardResolve) {
      tealiumNavGuardResolve();
      tealiumNavGuardResolve = null;
    }
  }
  function navigateAfterTealium(href) {
    Promise.race([
      tealiumNavGuard,
      new Promise((resolve) => setTimeout(resolve, 1500)),
    ]).then(() => {
      window.location.href = href;
    });
  }

  // Same utag.js integration as new-application.html's enableTealiumAnalytics,
  // adapted for a prospect who has no real customer record yet. Per explicit,
  // scoped request: customer_id is hardcoded to Sam Okafor's id ("CUST44",
  // Instellars' own "New-to-bank" segment customer) as a stand-in for now,
  // since a genuine prospect has no customer id to send until an application
  // is actually approved and an account is opened. customer_name instead
  // uses whatever the applicant actually typed in on Basic Info, since that's
  // real data worth sending, unlike the id.
  function enableTealiumAnalytics() {
    window.utag_data = window.utag_data || {};
    window.utag_data.customer_id = "CUST44";
    window.utag_data.customer_name = app.data.fullName || "";
    window.utag_data.product_type = app.product || "";
    window.utag_data.application_completed = app.completed;
    window.utag_data.tealium_datasource = "8gnkvp";
    window.utag_data.tealium_trace_id = "ABCDE1";
    window.utag_data.page_active_time = 30;
    window.utag_data.event_name = "PageView";
    window.utag_data.PercentageProgress = 60;

    function fireTealiumViewAndLink() {
      window.utag.view(window.utag_data);
      window.utag.link({
        event_name: app.completed ? "application_submitted" : "application_abandoned",
        product_type: app.product || "",
        customer_id: "CUST44",
        page_active_time: 30,
        PercentageProgress: 60,
      });
      setTimeout(releaseTealiumNavGuard, 150);
    }

    if (window.utag) {
      fireTealiumViewAndLink();
    } else {
      (function(a,b,c,d){
        a = "https://tags.tiqcdn.com/utag/instellars-sandbox/abhishek.banerjee/prod/utag.js";
        b = document; c = "script"; d = b.createElement(c);
        d.src = a; d.type = "text/java" + c; d.async = true;
        d.onload = fireTealiumViewAndLink;
        d.onerror = function () {
          console.error("Tealium utag.js failed to load — view()/link() not sent.");
          releaseTealiumNavGuard();
        };
        var r = b.getElementsByTagName(c)[0];
        r.parentNode.insertBefore(d, r);
      })();
    }
  }

  if (stage === 2) {
    document.title = app.completed === false ? "Abandoned Application" : "Application Submitted";
    enableTealiumAnalytics();
  }

  function renderBody() {
    const d = app.data;
    const isLoan = app.product === "Personal Loan";
    const finalStageLabel = app.completed === false ? "Abandoned Application" : "Confirmation";

    const stepperHtml = ["Basic Info", "Additional Info", finalStageLabel].map((label, i) => {
      const status = i === stage ? "current" : i < stage ? "done" : "upcoming";
      const dotContent = i < stage ? icon("check", 12) : String(i + 1);
      const connector = i < 2 ? `<div class="bnk-stepper-line ${i < stage ? "done" : ""}"></div>` : "";
      return `
        <div class="bnk-stepper-item">
          <span class="bnk-stepper-dot bnk-stepper-${status}">${dotContent}</span>
          <span class="bnk-stepper-label">${label}</span>
        </div>${connector}`;
    }).join("");

    let bodyHtml;
    if (stage === 0) {
      bodyHtml = `
        <div class="bnk-application-panel">
          <div class="bnk-display" style="font-size:1.2rem;margin-bottom:1.2rem;">Basic Info</div>
          <div class="bnk-form-group">
            <label class="bnk-form-label">What would you like to open?</label>
            <select class="bnk-form-select" onchange="handleFieldChange('product', this.value)">
              <option value="">Select one</option>
              <option value="New Deposit Account" ${app.product === "New Deposit Account" ? "selected" : ""}>New Deposit Account (Checking or Savings)</option>
              <option value="Personal Loan" ${app.product === "Personal Loan" ? "selected" : ""}>Personal Loan</option>
            </select>
          </div>
          <div class="bnk-form-row">
            <div class="bnk-form-group">
              <label class="bnk-form-label">Full name</label>
              <input class="bnk-form-input" type="text" placeholder="Jane Doe" value="${d.fullName || ""}" oninput="handleFieldChange('fullName', this.value)" />
            </div>
            <div class="bnk-form-group">
              <label class="bnk-form-label">Age</label>
              <input class="bnk-form-input" type="number" placeholder="34" value="${d.age ?? ""}" oninput="handleFieldChange('age', this.value)" />
            </div>
          </div>
          <div class="bnk-form-row">
            <div class="bnk-form-group">
              <label class="bnk-form-label">Email address</label>
              <input class="bnk-form-input" type="email" placeholder="jane@example.com" value="${d.email || ""}" oninput="handleFieldChange('email', this.value)" />
            </div>
            <div class="bnk-form-group">
              <label class="bnk-form-label">Phone number</label>
              <input class="bnk-form-input" type="tel" placeholder="(555) 555-0100" value="${d.phone || ""}" oninput="handleFieldChange('phone', this.value)" />
            </div>
          </div>
          <div class="bnk-application-actions">
            <span></span>
            <button class="bnk-btn-primary" style="flex:none;padding:0.6rem 1.4rem;" onclick="handleContinueFromBasicInfo()">Continue ${icon("chevronRight", 14)}</button>
          </div>
        </div>`;
    } else if (stage === 1) {
      const productFieldsHtml = isLoan ? `
          <div class="bnk-form-row">
            <div class="bnk-form-group">
              <label class="bnk-form-label">Loan amount</label>
              <input class="bnk-form-input" type="text" placeholder="$12,000" value="${d.loanAmount || ""}" oninput="handleFieldChange('loanAmount', this.value)" />
            </div>
            <div class="bnk-form-group">
              <label class="bnk-form-label">Tenure</label>
              <input class="bnk-form-input" type="text" placeholder="3 years" value="${d.tenure || ""}" oninput="handleFieldChange('tenure', this.value)" />
            </div>
          </div>
          <div class="bnk-form-group">
            <label class="bnk-form-label">Interest rate</label>
            <input class="bnk-form-input" type="text" readonly disabled value="Not available" style="background:var(--paper-alt);color:var(--ink-soft);cursor:not-allowed;" />
          </div>` : `
          <div class="bnk-form-row">
            <div class="bnk-form-group">
              <label class="bnk-form-label">Account type</label>
              <select class="bnk-form-select" onchange="handleFieldChange('accountType', this.value)">
                <option value="">Select one</option>
                <option value="Checking" ${d.accountType === "Checking" ? "selected" : ""}>Checking</option>
                <option value="Savings" ${d.accountType === "Savings" ? "selected" : ""}>Savings</option>
              </select>
            </div>
            <div class="bnk-form-group">
              <label class="bnk-form-label">Initial deposit</label>
              <input class="bnk-form-input" type="text" placeholder="$500" value="${d.initialDeposit || ""}" oninput="handleFieldChange('initialDeposit', this.value)" />
            </div>
          </div>`;
      bodyHtml = `
        <div class="bnk-application-panel">
          <div class="bnk-display" style="font-size:1.2rem;margin-bottom:1.2rem;">Additional Info</div>
          <div class="bnk-form-group">
            <label class="bnk-form-label">Mailing address</label>
            <input class="bnk-form-input" type="text" placeholder="123 Main St, Springfield" value="${d.address || ""}" oninput="handleFieldChange('address', this.value)" />
          </div>
          <div class="bnk-form-row">
            <div class="bnk-form-group">
              <label class="bnk-form-label">Employment status</label>
              <select class="bnk-form-select" onchange="handleFieldChange('employment', this.value)">
                <option value="">Select one</option>
                <option value="Employed" ${d.employment === "Employed" ? "selected" : ""}>Employed</option>
                <option value="Self-employed" ${d.employment === "Self-employed" ? "selected" : ""}>Self-employed</option>
                <option value="Student" ${d.employment === "Student" ? "selected" : ""}>Student</option>
                <option value="Retired" ${d.employment === "Retired" ? "selected" : ""}>Retired</option>
              </select>
            </div>
            <div class="bnk-form-group">
              <label class="bnk-form-label">Annual income</label>
              <input class="bnk-form-input" type="text" placeholder="$50,000" value="${d.income || ""}" oninput="handleFieldChange('income', this.value)" />
            </div>
          </div>
          ${productFieldsHtml}
          <div class="bnk-application-actions">
            <button class="bnk-btn-ghost" onclick="handleExit()">Exit</button>
            <button class="bnk-btn-primary" style="flex:none;padding:0.6rem 1.4rem;" onclick="handleFinalize()">${icon("check", 14)} Finalize</button>
          </div>
        </div>`;
    } else {
      const completed = app.completed === true;
      const productLabel = isLoan ? "loan" : "account";
      bodyHtml = `
        <div class="bnk-application-panel">
          <div class="bnk-confirmation-wrap">
            <div class="bnk-confirmation-icon ${completed ? "success" : "muted"}">${completed ? icon("check", 28) : icon("x", 28)}</div>
            <div class="bnk-display bnk-confirmation-title">${completed ? "Application Submitted" : "Abandoned Application"}</div>
            <div class="bnk-confirmation-sub">
              ${completed
                ? `Thanks, ${d.fullName || "there"} — your new ${productLabel} application has been submitted and is being reviewed. We'll reach you at ${d.email || "the email you provided"} with next steps.`
                : "The application was exited before all steps were finished. No submission was made."}
            </div>
            <div style="display:flex; gap:0.6rem; justify-content:center; flex-wrap:wrap;">
              ${!completed ? `<button class="bnk-btn-ghost" onclick="handleStartOver()">${icon("refreshCw", 14)} Start over</button>` : ""}
              <a class="bnk-btn-primary" style="flex:none;padding:0.6rem 1.4rem;text-decoration:none;" href="browse.html" onclick="handleExitToBrowse(event)">Back to Instellars</a>
            </div>
          </div>
        </div>`;
    }

    return `
      <div>
        <div class="bnk-header">
          <div class="bnk-brand" style="margin-bottom:0;">${icon("landmark", 20)}<span class="bnk-brand-word">Instellars</span></div>
          <div class="bnk-header-right">
            <span style="font-size:0.85rem;">Open a New Account or Loan</span>
            <a class="bnk-signout-btn" style="text-decoration:none;" href="browse.html" onclick="handleExitToBrowse(event)">${icon("x", 14)}<span> Exit</span></a>
          </div>
        </div>
        <div class="bnk-body">
          <div class="bnk-stepper-row" style="justify-content:center;">${stepperHtml}</div>
          ${bodyHtml}
        </div>
      </div>`;
  }

  function paint() {
    document.getElementById("app").innerHTML = renderBody();
  }

  window.handleFieldChange = function (field, value) {
    if (field === "product") {
      app.product = value;
    } else {
      app.data[field] = value;
    }
    saveProspectApplication(app);
  };
  window.handleContinueFromBasicInfo = function () {
    if (!app.product) {
      alert("Please choose whether you'd like to open a new account or a loan before continuing.");
      return;
    }
    saveProspectApplication(app);
    window.location.href = stageHref(1);
  };
  window.handleExit = function () {
    app.completed = false;
    saveProspectApplication(app);
    window.location.href = stageHref(2);
  };
  window.handleFinalize = function () {
    app.completed = true;
    saveProspectApplication(app);
    window.location.href = stageHref(2);
  };
  window.handleStartOver = function () {
    const fresh = { product: null, data: {}, completed: null };
    saveProspectApplication(fresh);
    navigateAfterTealium(stageHref(0));
  };
  // Only the confirmation page (stage 2) has a pending Tealium call to wait
  // for — everywhere else this link should navigate immediately.
  window.handleExitToBrowse = function (e) {
    if (stage !== 2) return;
    e.preventDefault();
    navigateAfterTealium("browse.html");
  };

  paint();
</script>
</body>
</html>
